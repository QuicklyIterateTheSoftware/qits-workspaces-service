# Test-only overrides. Nothing else.
#
# This module is the deployable, so `src/main/resources/application.properties` is on the test
# classpath too and Quarkus MERGES it — a key removed from here keeps the shipped value. So
# app-level settings are INHERITED and must never be re-declared here: a test copy that silently
# drifts from the shipped one makes the whole suite lie about what the packaged app does.
#
# What belongs here is only what a test genuinely needs to be different: the database, and the
# on-disk tree it is allowed to write to.

# A FREE port, not Quarkus' default test port 8081. Two reasons, and the first is not theoretical:
# on the deployment host 8081 is where the platform's own npm registry (qits-platform-artifacts) is
# published — the address the frontends' .npmrc files name — so on the one machine this service is
# most likely to be built on, the default test port is already bound and the whole suite dies with
# "Port already bound: 8081", which reads like a code failure and is not one. Even where 8081 is
# free, @QuarkusTest restarts race each other for it. 0 lets the OS pick and RestAssured is told the
# real port. A test-only value, which is why it belongs here.
quarkus.http.test-port=0

# NO DEV SERVICES. A dev service is a container start, and this repo's rule is that a clone tests
# green with no docker. Nothing here needs one — both datasources get a url from
# EmbeddedPgConfigSource before Quarkus looks — and this line is what keeps that a fact rather than
# a coincidence.
quarkus.devservices.enabled=false

# The suite runs against an EMBEDDED POSTGRES — real binaries, spawned as a child process by zonky,
# never a container, which is what keeps the no-docker rule true now that both stores are postgres.
# The port is chosen at run time, so the url/username/password of BOTH datasources are not written
# here at all: EmbeddedPgConfigSource supplies them at an ordinal above this file. What is left here
# is what a file can say. clean-at-start wipes the schema between Quarkus restarts, which is what
# keeps a suite sharing one database across classes reproducible.
quarkus.hibernate-orm.workspaces.datasource=workspaces
quarkus.hibernate-orm.workspaces.packages=eu.wohlben.qits.workspaces.entity
quarkus.flyway.workspaces.migrate-at-start=true
quarkus.flyway.workspaces.clean-at-start=true
quarkus.flyway.workspaces.locations=classpath:db/workspaces/migration

# Where the suite's fixture git host lives: TestOrigin builds a bare origin per repository under
# target/, so a run leaves nothing behind, and FakeGitHostAddress points the mirror's fetch and push
# at them — which is what makes every push in this suite a real push into a real bare.
#
# TEST-ONLY. Nothing in src/main reads this key and no deployment sets it. It stands in for the git
# host, which in a deployment is qits.githost.url over HTTP and is on nobody's disk.
qits.test.origins-dir=target/workspaces-test-data

# This service's own tree: the git mirrors, their worktrees and the metadata sidecars. Separate from
# the line above on purpose — the tree it fetches from must not be the tree it keeps, or the suite
# would prove nothing about the separation.
qits.workspaces.data-dir=target/workspaces-test-own

# The shared harness volume as this service sees it. In a deployment it is a read-only mount of
# qits_shared_dot_claude; here it is a tree under target/ that WorkspaceHistoryControllerTest lays
# out itself, so the door can be exercised over real files rather than a stubbed port.
#
# A test-only value, and the third on-disk tree for the reason the other two are separate: the
# volume a workspace's agent wrote must not be the tree this service keeps or the one it fetches
# from. The attribution rule itself is proved without an application at all — see
# ClaudeTranscriptArchiveTest, which is why this key buys a door test and not a profile.
qits.workspace.claude-archive-root=target/workspaces-test-claude

# The transcript store the daemons' shipped chunks land in (qits-1752), a fourth tree under target/
# for the same reason: what a daemon shipped must not share a directory with what the mounted
# fallback reads, or a door test could not tell which of the two answered.
qits.workspace.transcript-store-root=target/workspaces-test-transcripts

# The suite's fixtures are seconds old and change between assertions, so nothing may be served from
# a freshness window. Shipped default is 5s; here every read fetches.
qits.workspace.git.mirror-freshness-ms=0

# The outbox's datasource needs the same wipe, and it is needed even though the bus is DARK in
# %test: `qits.eventstream.enabled=false` stops publishing and sweeping, not the datasource —
# Quarkus opens the connection and runs Flyway at boot regardless. Its url/username/password come
# from EmbeddedPgConfigSource beside this file's, pointing at a database named for this module so a
# sibling suite on the same host cannot mean it.
quarkus.flyway.eventstream.clean-at-start=true

# Another address nothing listens on, and it is here because a BEAN GRAPH changed rather than
# because a test dials it. qits.projects.url has no default anywhere (application.properties says
# why at length), and WorkspaceContainerFactory injects it as a required property — so the key is
# needed the moment that bean is RETAINED. It was not: every test constructs the factory by hand,
# nothing injected it, and ArC removed it as unused along with WorkspaceContainers, which
# FakeContainerRuntime outranks. PinsController injects it (the launch pins and the launch must
# read one value), so the bean is now in every test application and the whole suite would refuse to
# boot without a value here. Nothing reaches it: FakeRepositoryLookup still wins the injection and
# the REST client has its own unresolvable fallback. 127.0.0.1:1 rather than a plausible host, for
# the reason the containers url below is one.
qits.projects.url=http://127.0.0.1:1

# An address nothing listens on, so a suite that reaches the orchestrator unstubbed fails fast and
# honestly instead of finding a real qits-containers on the developer's own machine and deleting
# another process's containers. Every @QuarkusTest gets FakeContainerRuntime instead of the real
# adapter, so nothing here should reach this at all; the plain-JUnit adapter test constructs its own
# client against its own stub server.
qits.containers.url=http://127.0.0.1:1

# qits-ci, which a declared wait on a run is looked up in (epic qits-1681): nothing listens here
# either, and FakeWaitSubjectResolver wins the injection over wiring/HttpWaitSubjectResolver anyway.
qits.ci.url=http://127.0.0.1:1

# THE USERFLOWS CLASS ORDERER, INSTALLED THE ONE WAY QUARKUS PERMITS. quarkus-junit ships its own
# junit-platform.properties with a ClassOrderer that groups tests by @TestProfile (so a profile's
# application isn't torn down under a class still running), and surefire HARD-FAILS if a local
# junit-platform.properties overrides it. The blessed seam is the secondary orderer, which breaks
# ties INSIDE a profile group — story classes sharing a profile still run in topological
# @UserflowPrecondition order, and the ordinary test classes (no story annotations) are untouched.
# The framework's registries are per-JVM: keep the single sequential test JVM (surefire/failsafe
# default forkCount=1); do not enable parallel execution.
#
# It lives in this file rather than a failsafe-only one even though TokenValidationBootstrapIT is
# this module's only story today: src/test/resources is one classpath for surefire and failsafe
# alike, and a second copy under another name is a value free to drift.
junit.quarkus.orderer.secondary-orderer=eu.wohlben.qits.userflows.UserflowClassOrderer

# The lease reconcile is switched off in every suite: a test drives TargetLeaseEvents.reconcile()
# itself, against a stub. Not merely stretched: an interval job's first run is at boot, and a
# profile's fresh boot then races the test that follows it — a reconcile that found that test's
# hand-written lease missing from the stub ENDED it underneath the test.
qits.workspaces.target-leases.reconcile-interval=off

# domain's qits.workspace.image-repo expands ${QITS_DOMAIN} with no default (qits-1402: the
# registry moved behind the public edge, registry.qits.<domain>). WorkspaceContainerFactory is a
# bean here too, so a @QuarkusTest that boots it needs a value present or expansion throws at
# startup. A wohlben.eu-style value, same shape domain's own test properties use; nothing here
# asserts against it, and %test.qits.workspace.domain staying empty (domain's microprofile-config)
# is a separate key this does not touch.
QITS_DOMAIN=test.wohlben.eu
# The same value for the packaged app the @QuarkusIntegrationTest stories launch (qits-1163): that
# process runs the prod profile and never reads this file, so without it qits.workspace.image-repo
# cannot expand and the jar exits at boot. Production keeps qits-1402's no-default rule.
quarkus.test.arg-line=-DQITS_DOMAIN=test.wohlben.eu

# OpenApiSchemaExportTest writes the served document into docs/openapi.yml, and info.version
# otherwise follows the project version, which every release bumps without regenerating the file —
# so every local run left a one-line diff (qits-1512). Pinned here, test-only, so the committed
# document only changes when the API does; the packaged app still serves its real version.
quarkus.smallrye-openapi.info-version=0
