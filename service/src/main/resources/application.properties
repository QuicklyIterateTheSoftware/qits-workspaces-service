# The application config for qits-workspaces as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# `domain` ships DEFAULTS it does not own the deployment of. Everything about the workspace
# container, the daemon, the provisioning windows and the datasource stays in that file; a
# deployment still overrides any of it by env.
#
# Everything here was previously supplied by the monorepo's app shell
# (service/src/main/resources/application.properties, monolith-only), which is why the suite carried
# a private copy in src/test/resources and the packaged app had none.

quarkus.application.name=qits-workspaces

# --- the segment prefix -------------------------------------------------------------------------
# The edge routes VERBATIM by prefix: /workspaces/* reaches qits-workspaces, with no rewriting, on
# this service's own host and on every other one. So the service has to serve the prefixed path
# itself — there is no unprefixed form, and this service serves nothing at the root.
# `workspaces` is this service's segment (the name without the qits- prefix); `api` is the second
# level that says "a JSON API", alongside `daemon` (the control socket) and `container` (the daemon
# proxy), neither of which is one.
#
# The segment is spelled TWICE here — this key and quarkus.http.non-application-root-path — plus
# `routes:` in .config/qits/deployments.yml.
#
# Note this key governs the JAX-RS routes only — the raw Vert.x ones register straight onto the
# router and do NOT follow it, which is what RootPath exists to reconcile. The raw routes are
# prefixed by hand: ContainerProxyRoute serves ContainerProxyPath.PREFIX (/workspaces/container/),
# and CaptureCorsRoute derives its path from the prefix below so its preflight cannot drift off the POST
# it opens CORS for. The daemon control socket is a third: @WebSocket takes a literal,
# /workspaces/daemon/{id}.
#
# The value is spelled ONCE, as qits.rest.path, and quarkus.rest.path is derived from it — not the
# other way round, and not because an application-namespaced key reads better. quarkus.rest.path is
# a BUILD-TIME config item, and a build-time item is not in the runtime config of a native image:
# `@ConfigProperty(name = "quarkus.rest.path")` silently took its defaultValue of "/" in the binary,
# so CaptureCorsRoute registered on /capture — a path the gateway cannot reach — and the real
# endpoint at /workspaces/api/capture answered preflights with RESTEasy's bare 200 and no CORS
# headers at all. Every browser capture would have failed against the shipping artifact while the
# suite passed, because on the JVM fast-jar application.properties is an ordinary runtime config
# source and the same lookup succeeds. qits.rest.path is application-owned and runtime-phase, so it
# resolves in both. Read that one from code; let Quarkus have the derived copy.
qits.rest.path=/workspaces/api
quarkus.rest.path=${qits.rest.path}

# --- the API document -------------------------------------------------------------------------
# /q/* is what the framework serves rather than application code, and it sits OUTSIDE
# quarkus.rest.path — it moves only with this key. Same reason as above: the edge routes by prefix,
# and a document left at the root would not be routed here at all. The document lands at
# /workspaces/q/openapi and the browsable UI at /workspaces/q/swagger-ui; quarkus.swagger-ui.path is relative by default and follows on its own,
# so do not pin it.
quarkus.http.non-application-root-path=/workspaces/q

# always-include because swagger-ui is a dev-mode-only extension by default, and the point of
# packaging these as processes is that each documents its own surface in a real deployment.
quarkus.smallrye-openapi.info-title=qits-workspaces API
quarkus.swagger-ui.always-include=true

# Prompt-draft attachments are uploaded through this service; the monorepo raised this app-wide and
# these routes inherited it.
quarkus.http.limits.max-body-size=64M

# --- the daemon proxy needs a caller -------------------------------------------------------------
# /workspaces/container/* opens a workspace's terminals and writes its files, and it is a raw Vert.x
# route, so no @RolesAllowed reaches it. This permission is what keeps an anonymous caller — a
# request on qits-net with no bearer and no forwarded user — out before the route runs, WebSocket
# upgrades included (an upgrade is an ordinary GET to the policy). Which authenticated caller may
# reach WHICH workspace is ContainerProxyRoute's own check (qits-1386).
#
# Relative on purpose: a permission path with no leading slash is resolved against
# quarkus.http.root-path, the same base the route registers on, while a leading slash would be an
# absolute path the route stops matching the moment qits runs under a prefix.
quarkus.http.auth.permission.container-proxy.paths=workspaces/container/*
quarkus.http.auth.permission.container-proxy.policy=authenticated

# The same for the agent proxy, /workspaces/agent/{agentId}/* (epic qits-1667): it reaches the daemon
# of the workspace the agent is placed in, terminals included. Which caller may reach WHICH agent is
# AgentProxyRoute's own check.
quarkus.http.auth.permission.agent-proxy.paths=workspaces/agent/*
quarkus.http.auth.permission.agent-proxy.policy=authenticated

# --- the agent-activity rollup's ENDED state ------------------------------------------------------
# WorkspaceDaemonRegistry keeps a finished coding-agent session in the rollup instead of evicting it,
# because "just ended" is the state the agent-activity bar is ordered around — that workspace is the
# one waiting for your next prompt, and dropping it made it disappear at exactly that moment.
#
# The TTL is how long a session that stayed finished is still worth mentioning: long enough to
# survive a page reload and a coffee break (which is the whole reason the state lives on the server
# rather than being derived client-side from a transition to null), short enough that this morning's
# finished run is not still claiming a slot this afternoon. A live report always wins over it.
qits.workspace.agent-activity.ended-ttl-ms=1800000

# The sweep only ANNOUNCES the expiry — the rollup evaluates the TTL on every read, so the answer is
# already correct the instant it passes. This cadence is therefore a floor on how late the fade
# reaches an open browser, and nothing on this page polls, so without it a stale "Ended" would sit
# there until some unrelated hint fired.
qits.workspace.agent-activity.sweep-interval=60s

# --- no webui -------------------------------------------------------------------------------------
# This service serves NO web client. The workspace pages moved into qits-landing-app (epic
# qits-1230) and the qits-workspaces-frontend submodule, Quinoa and its SPA fallback went with them
# (qits-1245). Everything this service answers is under /workspaces, and any path outside the
# machine surface — /, /workspaces, /workspaces/ included — is a plain 404.

# --- what a deployment MUST provide -------------------------------------------------------------
# qits.projects.url — where qits-projects answers. NOT defaulted, and the service refuses to start
# without it (HttpRepositoryLookup): a workspace is a branch of a repository, this context holds no
# foreign key into the repositories tables, so with no registry to ask every repository-scoped route
# would 404 and every create would fail. That is a misconfiguration wearing the costume of an empty
# system, so it fails closed instead. Dev and test tolerate it absent.
#
# The value is scheme, host and port with NO path — qits-projects serves its own /projects/api
# segment, so the same base url works whether this call goes direct on qits-net or through the
# gateway. Any value this repo picked would be wrong somewhere, which is why there is no default:
#
#   both processes on one host   QITS_PROJECTS_URL=http://localhost:8090
#   containers on qits-net       QITS_PROJECTS_URL=http://qits-projects:8080
#
# Not derived from anything, deliberately. Deriving one service's address from another's is the
# mistake qits-workspace-daemon's notes name outright: it fails as a 404, and a 404 from a registry
# is indistinguishable from an empty one.
#
# The REST client reads the address from THIS key rather than the other way round, for the reason
# CaptureCorsRoute learned the hard way a few lines up: an application-owned key is what a
# deployment sets, and it is runtime-phase in a native binary as well as on the JVM. The fallback is
# a deliberately unresolvable host, not a plausible default — with the address unset a production
# build has already failed at startup, and in dev/test HttpRepositoryLookup short-circuits before
# the client is called, so this value should never be dialled. If it ever appears in a stack trace,
# the bug is that something bypassed the check.
#
# `stork://qits-projects` is accepted here verbatim if service discovery is ever configured; that is
# the whole reason this is the declarative client and not a hand-rolled HttpClient.
#
# THE PROD PROFILE NOW DERIVES IT (qits-1391). The deployer used to state QITS_PROJECTS_URL as an
# extra; every service is an ordinary service of its environment now, addressed <env>-qits-<app>, and
# QITS_ENVIRONMENT is injected into every container, so a deployed process derives its own
# environment's qits-projects. Dev and test still carry no default and keep the tolerance above, and
# the startup refusal still guards a prod process whose value was blanked.
%prod.qits.projects.url=http://${QITS_ENVIRONMENT:dev}-qits-projects:8080
quarkus.rest-client.qits-projects.url=${qits.projects.url:http://qits-projects.unconfigured.invalid}
# Bounded because this call sits on nearly every repository-scoped route: an unreachable registry
# has to fail fast enough to be an error rather than a hang. Both surface as a transport failure,
# which HttpRepositoryLookup deliberately does NOT read as "no such repository".
quarkus.rest-client.qits-projects.connect-timeout=2000
quarkus.rest-client.qits-projects.read-timeout=5000
#
# Note what this service has NO on-disk contract with any more: the shared volume of bare origins
# the git host serves. It neither reads nor writes it, there is no config key naming it, and a
# deployment does not mount it. Every ref this service moves is a push to qits.githost.url,
# because a filesystem ref update fires no post-receive and so produced no CI run for any branch
# create, merge or cleanup it ever performed. The one tree it opens is qits.workspaces.data-dir.
#
# And note the daemon control socket: /workspaces/daemon/ must be allow-listed for unauthenticated
# access at whatever fronts this service. It authenticates by workspace id, not by session — the
# callers are daemons inside workspace containers, which hold no user token by construction.
#
# --- what a deployment SHOULD provide -----------------------------------------------------------
# qits.githost.url — where the git host answers. Same shape as qits.projects.url above (scheme,
# host, port, NO path); the /git/<repoId> segment is qits-githost's own contract and is spelled in
# ConfiguredGitHostAddress. Defaulted in domain's microprofile-config.properties to the qits-net
# shape of the DEV environment, so a developer's process already works — but qits-githost is an
# environment service, so every other environment has to set it:
#
#   containers on qits-net       QITS_GITHOST_URL=http://dev-qits-githost:8080   (the default)
#   another environment          QITS_GITHOST_URL=http://prod-qits-githost:8080
#   both processes on one host   QITS_GITHOST_URL=http://localhost:8081
#
# It was QITS_ARTIFACTS_URL until the byte-plane split moved the git smart-HTTP server out of
# qits-artifacts. That name configures nothing now.
#
# It is the integrate flow's PUSH target, and it is defaulted rather than mandatory because the
# asymmetry with qits.projects.url is real: an unresolvable repository registry 404s every
# repository-scoped route, so it fails closed at startup, while an unreachable git host costs
# exactly one endpoint and says so when that endpoint is called.

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-workspaces` rather than qits-workspaces-service-<version>-runner, so
# `-Dnative` produces target/qits-workspaces and the process is identifiable in `ps` / `docker top`
# — which matters more here than elsewhere, since this host process sits beside a container per
# workspace and every one of them is also a qits binary. The failsafe plugin's native.image.path in
# service/pom.xml spells the same name; the two are the same string twice and move together.
quarkus.package.output-name=qits-workspaces
quarkus.package.jar.add-runner-suffix=false

# --- telemetry --------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path, exactly the
# shape qits.projects.url above already uses. The ingest path is qits-observability's own and
# belongs to the service, not to the deployment, so it is spelled once here and derived rather than
# configured. Point this at a collector or a different host and everything below follows.
#
# Unlike qits.projects.url this one IS defaulted and the service starts without it: a missing
# repository lookup 404s every repository-scoped route, while missing telemetry costs visibility
# and nothing else. Fail-closed is for what the service cannot do its job without.
qits.observability.url=http://${QITS_ENVIRONMENT:dev}-qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is OtelReceiverResource over HTTP, and the
# exporter appends /v1/<signal> to this base — so this resolves to the three ingest routes at
# /observability/api/otel/v1/{traces,logs,metrics}.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default. The receiver decodes all three signals, and
# a log record correlated to a trace is most of why the receiver exists.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop the platform's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit. Console
# logging is untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one,
# which is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# That an ordinary logger call really becomes an exported OTLP record is proven once, in qits-events:
# its OtelLogBridgeTest decodes a real ExportLogsServiceRequest and PackagedLogBridgeIT repeats the
# claim against the packaged artifact. The same extension and the same four keys run here, so this
# repo guards the configuration rather than re-proving the behaviour — OtelLogConfigTest pins these
# values so drift cannot disable log export quietly.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# --- the platform event bus ----------------------------------------------------------------------
# This service PUBLISHES the agent and workspace lifecycle (qits-1236): `AgentPlaced` through
# `AgentRemoved` and `AgentHarnessExited`, and `WorkspaceStarted`/`WorkspaceFailed`/
# `WorkspaceRemoved`, the records in the `workspaces-events` module, handed to the bus by
# bus/EventstreamLifecycleAnnouncer on a thread of its own. It LISTENS once (qits-1153):
# bus/AgentWaitListener, a durable consumer `qits-workspaces.agent-waits` on `*`, matching agents'
# declared waits; its claims and watermark live in the eventstream datasource below. The rest of the
# qits-eventstream jar here is the causation half — the persistence trio `domain`'s entities
# implement, and bus/EventstreamPushCausation, which stamps the ambient cause onto every push.
#
# NOTHING THE BUS NEEDS IS SPELLED HERE, deliberately. `qits.events.url`, the outbox's datasource
# and Flyway lineage, the publish timeout and the retry budget all ship as defaults in that jar's
# META-INF/microprofile-config.properties at ordinal 100 — the same way `domain` ships its own — and
# a copy in this file would be a second place to change and a silent way for the two to drift. A
# deployment overrides them by env, unchanged by anything here: `QITS_EVENTS_URL`, and the outbox's
# PostgreSQL database through the platform's resource contract (`QITS_RESOURCE_EVENTSTREAM_URL`,
# `_USERNAME`, `_PASSWORD`; see docker/Dockerfile and README.md, "Deploying it").
#
# What DOES belong here is the darkness, because the library ships enabled — a library that shipped
# dark would be one whose first deployment discovers it was never wired up — and the deployable is
# what owns where it is real. Same policy and same reasoning as the OTel keys above: a clone-alone
# `./mvnw verify` and a `quarkus:dev` have no qits-events on the far side, and enabled, a publish
# would pay the timeout dialling an unresolvable host and leave an outbox row for the sweeper to
# retry. Off means publish() is a debug line and the sweeper does nothing — there is no half-enabled
# state. The suites assert the lifecycle events through the `LifecycleAnnouncer` port instead.
%dev.qits.eventstream.enabled=false
%test.qits.eventstream.enabled=false

# --- talking to qits-containers -----------------------------------------------------------------
#
# Every workspace container and every workspace volume is the orchestrator's. This service holds no
# docker socket and spawns no process for any of it — containershost/WorkspaceContainers is the one
# adapter, and containers/ContainersClientProducer is where a token becomes a header.
#
# Where qits-containers answers, and the two deadlines, are NOT here: they ship as defaults in the
# client jar's own META-INF/microprofile-config.properties at ordinal 100 (qits.containers.url,
# qits.containers.client.request-timeout, qits.containers.client.ensure-timeout), the same
# arrangement qits-eventstream has. A copy in this file would be a second place to change. A
# deployment overrides them by env: QITS_CONTAINERS_URL.

# Who this process IS to the orchestrator, and the second half of every place it addresses.
#
# It MUST equal the `sub` of the machine token this service presents once the gate is on, because
# qits-containers' OwnerGuard compares them — so it defaults to reading
# quarkus.oidc-client.qits.client-id below (epic qits-540 dossier, 'Plan (as of 2026-09-13)', C4) and the coupling
# lives in exactly one place, this line. It is also the scope: two environments sharing one docker
# daemon are dev-qits-workspaces and prod-qits-workspaces, and neither one's rows name the other's
# containers. Two instances must not share it.
qits.workspace.containers.owner=${quarkus.oidc-client.qits.client-id:qits-workspaces}

# How long a launch holds through an orchestrator that cannot authorize it yet, or cannot be reached
# at all, asking again about every five seconds.
#
# The measured window is the trailing edge of a qits-platform-idp cutover: on 2026-08-12 the deploy
# train replaced the idp and qits-ci's next three step launches died with `refused 401` while every
# later one passed — this service's token, or the orchestrator's copy of the signing keys, belonged
# to the idp that had just been replaced. Each attempt asks the TokenSource again, which is the only
# way a post-cutover token is ever picked up. Retrying is safe for a reason a bare `docker run` never
# had: ensure is a PUT per (owner, workload, ref), so a second attempt addresses the same place and a
# container an unanswered attempt created is adopted rather than duplicated.
#
# It sits BESIDE the ensure deadline rather than inside it — that one is mostly an image pull — so
# the worst case is this window plus one whole ensure.
qits.workspace.containers.launch-patience=PT90S

# The inbound resource-server half follows the machine-auth rollout gate. A deployed platform turns
# it on for a token-holding workspace daemon's control WebSocket; clone-alone tests and local
# development keep using forward-auth without needing a live IdP.
#
# ONE audience is accepted and it is the PLATFORM's, not this service's: qits-idp stamps
# `qits-platform` onto every token it mints, whichever client asked and whatever it asked for, so a
# receiver that takes that audience is addressed by every caller there is — a peer service, a
# workspace container's token (as the edge exchanges it) and a person's `qits` CLI token alike. The audience
# says only that a token was cut by this platform's idp; what its holder may do is decided by its
# ROLES, at the door it knocks on.
#
# Which tokens are this service's own is not stated here. `qits-platform` is THE audience on this
# platform — qits-idp puts it on every token it mints, whatever the client asked for — and the guard
# (qits-auth-core's MachineAuth) reads it from its own shipped `qits.auth.machine.platform-audience`.
# It is not a deployment fact: a service that accepted tokens addressed elsewhere would be broken, not
# configured differently. What a caller may do once it is in is decided by its ROLES; the audience
# only says the token was meant for us.
#
# THE GATE IS ON WHEREVER THE DEPLOYER RUNS THIS SERVICE, and off for clone-alone tests and local
# development — the same split qits-githost ships. It used to be switched on by the deployer extra
# QITS_AUTH_MACHINE_REQUIRED=true; that is a property of the image, so it ships here (qits-1391).
qits.auth.machine.required=true
%dev.qits.auth.machine.required=false
%test.qits.auth.machine.required=false
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}
# QITS_ENVIRONMENT is injected into every container, so this is the derived address every deployment
# resolves for itself: ${QITS_ENVIRONMENT:dev}-qits-idp.
quarkus.oidc.auth-server-url=http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp
quarkus.oidc.application-type=service
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=jwks
# A literal, and deliberately not an expression over the key above: the value is the platform's own
# name, which is the same string in every service and is not a deployment's to move.
quarkus.oidc.token.audience=qits-platform
quarkus.oidc.connection-delay=30S
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S

# --- the token this service PRESENTS ---------------------------------------------------------------
# ONE named client, `qits` (epic qits-540 dossier, 'Plan (as of 2026-09-13)', C4), carries every
# outbound identity this service has: the bearer sent to qits-containers, the bearer sent to
# qits-githost, the bearer sent to qits-projects, and the Basic pair IdpCredentialCommissioner
# presents to mint a per-workspace-container token. It is the only client any code here
# injects, and the only one that ever fetches a token (see "the unnamed default client" further down
# for the one block that stays beside it, and why it is not a leftover).
#
# qits.workspace.containers.owner reads this client's id by default (see that key's own comment
# above); IdpCredentialCommissioner reads its id and secret directly for the Basic call it makes.
#
# Its id, secret and idp address are this application's own qits-idp service client, and they come
# from the deployer and nowhere else. .config/qits/deployments.yml declares `resources: idp:client`,
# so qits-deployments provisions the client (id `<env>-qits-workspaces`, roles fixed in qits-idp
# code), stores its secret the way it stores a database password, and injects QITS_RESOURCE_IDP_URL,
# QITS_RESOURCE_IDP_CLIENT_ID and QITS_RESOURCE_IDP_CLIENT_SECRET into every container it starts
# (epic qits-540 dossier, 'Plan (as of 2026-09-13)', C3/C5). No configuration entry names any of the
# three. Reference the raw env names inside ${…}, never a dotted key: QITS_RESOURCE_* has no dotted
# twin anywhere, and the env lookup is what reads the environment source directly.
#
# The defaults are what the deployer would inject on the dev estate: the idp's `<env>-qits-idp` alias
# on qits-net, derived like the tenant's address above, and the client id `dev-qits-workspaces`. They
# only decide anything where no deployer started the process, and there the secret is empty, so a
# token request is refused rather than presenting somebody else's credential.
quarkus.oidc-client.qits.auth-server-url=${QITS_RESOURCE_IDP_URL:http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp}
quarkus.oidc-client.qits.discovery-enabled=false
quarkus.oidc-client.qits.token-path=token
quarkus.oidc-client.qits.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:dev-qits-workspaces}
quarkus.oidc-client.qits.credentials.secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:}
quarkus.oidc-client.qits.grant.type=client
# One audience for every service, the plan's ruling (epic qits-540 dossier, 'Plan (as of
# 2026-09-13)'): qits-platform. Not qits-containers, not qits-githost, not qits-projects — a
# receiving service takes this audience and no other, exactly as the validation block above does,
# and judges the caller on its roles.
quarkus.oidc-client.qits.grant-options.client.audience=qits-platform
quarkus.oidc-client.qits.early-tokens-acquisition=false
# On wherever the deployer runs it — every deployment has the resource, so there is no switch to
# flip. Off under %dev and %test, so a suite or a local run never dials an idp.
quarkus.oidc-client.qits.client-enabled=true
%dev.quarkus.oidc-client.qits.client-enabled=false
%test.quarkus.oidc-client.qits.client-enabled=false

# --- the unnamed default client, which the container still carries and which still has to be spelled
# No code asks for it: ContainersClientProducer, IdpGitHostBearer and IdpProjectsBearer all inject
# `qits` above, and IdpCredentialCommissioner reads `qits`'s own config properties directly. It is
# here because the container still carries QUARKUS_OIDC_CLIENT_{CLIENT_ID,CREDENTIALS_SECRET,
# AUTH_SERVER_URL,CLIENT_ENABLED,GRANT_OPTIONS_CLIENT_AUDIENCE} (read off dev-qits-workspaces's
# envKeys, 2026-10-02) — the old extras nothing reads any more, and this application declares none
# of them — and one such variable is enough to mint the
# `quarkus.oidc-client.<unnamed>` map key. Left unspelled it would then take the extension's own
# defaults, which go the other way: discovery ON and early token acquisition ON, putting an idp round
# trip in front of the HTTP listener at boot. The lines below are what make that harmless — off by
# default, and inert rather than eager if something turns it on.
#
# The `qits` client above is unaffected: it reads only QITS_RESOURCE_IDP_*, not these names, so
# nothing here can switch it on or off. The address below is derived the same way the tenant's and
# the `qits` client's are — ${QITS_ENVIRONMENT:dev}-qits-idp — though it is never dialled while
# discovery stays off and nothing asks this client for a token.
quarkus.oidc-client.client-enabled=false
quarkus.oidc-client.auth-server-url=http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp
quarkus.oidc-client.discovery-enabled=false
quarkus.oidc-client.token-path=token
quarkus.oidc-client.client-id=qits-workspaces
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.early-tokens-acquisition=false

# --- `githost` and `projects`: two names THE CONTAINER still carries -------------------------------
# No code injects either and neither is an outbound identity of this service any more — `qits` above
# carries all of them. They are spelled here because the container still carries
# QUARKUS_OIDC_CLIENT_GITHOST_* and QUARKUS_OIDC_CLIENT_PROJECTS_* (read off dev-qits-workspaces's
# envKeys, 2026-10-02), and SmallRye Config discovers a `quarkus.oidc-client.<name>` map key FROM THE
# ENVIRONMENT SOURCE: any single such variable mints the key, and `client-enabled` and
# `discovery-enabled` then both default to TRUE. An enabled client is built during runtime init —
# OidcClientsImpl's constructor awaits createOidcClient(…) for each named key, serially, BEFORE the
# HTTP listener accepts — and a discovering one dials the issuer there. Connection refused is a fast
# WARN; an issuer that accepts and does not answer (a proxy in front of a still-starting idp, a
# wedged idp) FAILS THE BOOT on the connection timeout, per client.
#
# WHICH LINE DOES THE WORK is measured, not assumed — PhantomOidcClientsNeutralisedTest:
#   * `client-enabled=false` CANNOT win against the live container. The environment source sits at
#     ordinal 300 and this file at 250, and the container sets ..._GITHOST_CLIENT_ENABLED=true and
#     ..._PROJECTS_CLIENT_ENABLED=true, so the shipped `false` is overridden and the client is built
#     anyway. It is stated regardless: it is the intent, it is what takes effect the moment those
#     entries are deleted, and it is what keeps the key inert wherever they were never set.
#   * `discovery-enabled=false` is what actually stops the dial. Nothing in the deployment spells
#     ..._DISCOVERY_ENABLED, so this file is the highest source that answers, and the recorder then
#     builds the token endpoint locally instead of fetching the metadata.
#   * `token-path` is not optional beside it. With discovery off and no token path the metadata's
#     token endpoint is null and the recorder throws ConfigurationException — a failed boot by
#     another name.
# `early-tokens-acquisition` is deliberately NOT restored: it is read only by AbstractTokensProducer,
# a @PostConstruct on a per-injection-point producer, and nothing here injects either client's tokens.
#
# These six lines go once no QUARKUS_OIDC_CLIENT_GITHOST_* / QUARKUS_OIDC_CLIENT_PROJECTS_* variable
# reaches the container any more — the config GC deletes the retired entries and the deployer's
# extras file stops stating them (qits-375: a deleted config entry still reaches the container while
# that file names it) — and not one release before. This application deliberately declares neither
# family, so the configuration UI offers exactly that deletion.
quarkus.oidc-client.githost.client-enabled=false
quarkus.oidc-client.githost.discovery-enabled=false
quarkus.oidc-client.githost.token-path=token
quarkus.oidc-client.projects.client-enabled=false
quarkus.oidc-client.projects.discovery-enabled=false
quarkus.oidc-client.projects.token-path=token

# --- the credential each workspace container holds ------------------------------------------------
#
# A workspace container is a dynamic context, so it gets a credential of its own rather than a share
# of a durable one: a non-expiring workspace token (qits_tok_), minted when the container is
# provisioned (or its lease asked for), injected as QITS_TOKEN, deleted when the container is torn
# down. wiring/IdpCredentialCommissioner is the implementation. A DIRECT workspace on a deployment
# with no public QITS_DOMAIN is refused rather than provisioned: a token only works through the edge.
#
# There is NO enable key of ours. quarkus.oidc-client.qits.client-enabled above is read a fourth
# time here for the same reason it is read three times already: off, this process holds no secret,
# so it can authenticate against no commission API and nothing is minted — every container launches
# with no credential env at all.
#
# Where the commission API answers is DERIVED, not configured: it is qits-idp's own /api/tokens (and
# /api/clients, which is only listed and given back now) under the very base this service already
# fetches tokens from. One address means the two can never name different idps.
quarkus.rest-client.qits-idp.url=${quarkus.oidc-client.qits.auth-server-url}
# Bounded, and wider on the read than the registry's: a mint is one write per container launch,
# not a per-request lookup, and the launch has patience of its own around it (below).
quarkus.rest-client.qits-idp.connect-timeout=2000
quarkus.rest-client.qits-idp.read-timeout=10000

# How long a token mint holds through an idp that cannot answer yet, asking again about every three
# seconds. The measured window is the same one qits.workspace.containers.launch-patience covers — a
# deploy train replacing qits-platform-idp, after which the next few calls answer 401 and the later
# ones pass. It is shorter than that one because it stands in front of it: a launch that spends this
# window and then the launch window is a person waiting.
qits.workspace.commission.patience=PT30S

# How often wiring/CommissionReconciler asks qits-idp what it is holding for this service and gives
# back whatever no live workspace container claims — every workspace client it still lists, and every
# workspace token no row holds. Also runs once at boot, which is what catches a crash that lost a
# deletion. Hourly: a leaked credential is a credential nothing can use to
# reach a container that no longer exists, so this bounds how long one lingers rather than racing
# anything.
qits.workspace.commission.reconcile-interval=1h

# --- agents (qits-1152) ----------------------------------------------------------------------------
# How often wiring/AgentSweep runs a scheduler pass beside the ones every door kicks: placing queued
# agents, starting and talking to running ones, yielding, and the cleanup sweep.
qits.workspace.agent.sweep-interval=5s

# How long a RUNNING agent may wait for input before it yields its workspace to another agent that
# wants it. The blocked-detection time, qits-projects' qits.projects.agent-waiting.debounce.
qits.workspace.agent.yield-after=PT30S

# How long a dispatched agent may sit quiet after ending its turn with no open wait and no explicit
# block on its item before the scheduler hands it a short nudge as its next turn (qits-1460). The
# quiet clock starts at the later of waiting_since (the turn ended) and the last frame. Zero or a
# negative duration switches nudging off.
qits.workspace.agent.nudge-after=PT20M

# At most this many nudges in a row with no other turn between them (qits-1460), each waiting twice
# as long as the one before (qits-1511): the k-th needs nudge-after x 2^(k-1) of quiet, so 20, 40
# and 80 minutes by default. A dispatch instruction, a delivery, a wait's wake and a declared wait
# start the count again; an agent that answers its nudges with nothing stays idle for a person.
qits.workspace.agent.nudge-limit=3

# How long an agent its daemon reads IDLE or WAITING may go with no frame and no waiting_since
# before the scheduler treats it as waiting since its last frame (qits-1511), so the yield and the
# nudge see it: a workspace daemon from before qits-1511 could swallow a turn's Stop, leaving the
# agent idle for good. Just past the daemon's background-work grace
# (qits.workspace-daemon.agent-waiting.background-work-grace=60m), after which the daemon itself
# reads such an agent as idle. Zero or a negative duration switches the repair off.
qits.workspace.agent.stale-idle-after=PT65M

# How often the scheduler asks git whether a closed (VERIFIED or DONE) item's agent, whose wrapper
# branch no release consumed, has a branch that holds nothing the default branch lacks — gone from
# the git host, or already merged — so the agent can be made OBSOLETE (qits-1605). One ls-remote and
# one forced mirror fetch per agent per interval. Zero or a negative duration asks every pass.
qits.workspace.agent.closed-branch-check-every=PT5M

# How long an OBSOLETE agent of a VERIFIED item must be idle before the cleanup sweep checks it and
# removes it (D4): the same time, so nothing stray sneaked in between the release and the removal.
qits.workspace.agent.cleanup-idle=PT30S

# --- execution targets (epic qits-1481) -------------------------------------------------------------
# A regular workspace's container runs in a WORKSPACE slot of an execution target, under a lease
# qits-system grants (targethost/TargetLeasePlacement). qits.system.url is where qits-system answers:
# scheme, host and port with NO path, the shape qits.observability.url has — qits-system serves its
# own /system/api segment. Defaulted to the qits-net alias of this environment's qits-system, so a
# deployment sets nothing; an unreachable one fails a start with 409 TARGET_UNAVAILABLE and leaves
# the row as it was. The bearer is the `qits` oidc client's below (qits:system, audience
# qits-platform), which qits-system names the lease's owner by.
qits.system.url=http://${QITS_ENVIRONMENT:dev}-qits-system:8080
quarkus.rest-client.qits-system.url=${qits.system.url}
quarkus.rest-client.qits-system.connect-timeout=2000
quarkus.rest-client.qits-system.read-timeout=10000

# --- what a declared wait waits on (epic qits-1681) -------------------------------------------------
# A wait on a run looks the run up in qits-ci (wiring/CiRuns, getRun) once it is declared, and on a
# scheduler pass while that lookup failed. qits.ci.url is where qits-ci answers: scheme, host and port
# with NO path, the shape qits.system.url has above — qits-ci serves its own /ci/api segment.
# Defaulted the same way, to the qits-net alias of this environment's qits-ci, so a deployment sets
# nothing; an unreachable one writes the wait's subject_error and fails nothing. The bearer is the
# `qits` oidc client's. A wait on a release request or a work item asks qits-projects, on the
# qits-projects client above.
qits.ci.url=http://${QITS_ENVIRONMENT:dev}-qits-ci:8080
quarkus.rest-client.qits-ci.url=${qits.ci.url}
quarkus.rest-client.qits-ci.connect-timeout=2000
quarkus.rest-client.qits-ci.read-timeout=5000
# When a run should have finished (the wait's subject_expected_by): with a prediction from qits-ci,
# (startedAt, else now) + factor × the predicted step durations + grace; with none, createdAt +
# unpredicted-after.
qits.workspaces.attention.run-overdue-factor=2
qits.workspaces.attention.run-overdue-grace=PT15M
qits.workspaces.attention.run-unpredicted-after=PT2H
# How long after a failed lookup the scheduler pass leaves the wait alone before it asks again.
qits.workspaces.waits.subject-retry-every=PT1M

# --- what an agent needs a person for (epic qits-1681, AgentAttention) -------------------------------
# IDLE_NO_WAIT: RUNNING and waiting for input this long with no wait, no turn and no block.
qits.workspaces.attention.idle-after=PT30M
# BLOCKED_NO_DESK: an explicit block standing this long with no @desk comment since it began.
qits.workspaces.attention.blocked-after=PT30M
# WAIT_OVERDUE: a release request waited on, in one unfinished state this long. A run's is its
# expected finish above.
qits.workspaces.attention.request-overdue-after=PT3H

# --- the look-back of declared waits (qits-1668) ----------------------------------------------------
# A declared wait also replays the events of its name from this long before the declaration, so a
# wait on an outcome that already happened fires at once. Long enough for an agent's turn between an
# action and its wait; short enough that an older, unrelated event of the same name rarely matches.
# PT0S turns it off. The log is qits-events' list API, at qits.events.url (qits-eventstream's key).
qits.workspaces.waits.lookback=PT15M
%test.qits.workspaces.waits.lookback=PT0S
quarkus.rest-client.qits-events.url=${qits.events.url}
quarkus.rest-client.qits-events.connect-timeout=2000
quarkus.rest-client.qits-events.read-timeout=5000
# How often targethost/TargetLeaseEvents lists this service's leases and maps each onto its row:
# the catch-up for a TargetLeaseChanged that was lost, qits-system's own advice (its event's
# javadoc). Also where an orphaned lease is ended.
qits.workspaces.target-leases.reconcile-interval=PT30S
# How long a TARGET row may read RUNNING or PROVISIONING with no lease and no workspace-daemon
# connected before that reconcile writes it STOPPED, its container gone (qits-1592): what V30 left of
# a row a retired runner held RUNNING. Counted from the first pass that sees it so.
qits.workspaces.target-leases.leaseless-grace=PT5M
