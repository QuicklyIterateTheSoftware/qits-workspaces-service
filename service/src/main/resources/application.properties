# The application config for qits-workspaces as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# `domain` ships DEFAULTS it does not own the deployment of. Everything about the workspace
# container, the daemon, the provisioning windows and the datasource stays in that file; a
# deployment still overrides any of it by env.
#
# Everything here was previously supplied by the monorepo's app shell
# (service/src/main/resources/application.properties, monolith-only), which is why the suite carried
# a private copy in src/test/resources and the packaged app had none.

quarkus.application.name=qits-workspaces

# --- the segment prefix -------------------------------------------------------------------------
# The edge routes VERBATIM by prefix: /workspaces/* reaches qits-workspaces, with no rewriting, on
# this service's own host and on every other one. So the service has to serve the prefixed path
# itself — there is no unprefixed form for the MACHINE surface, and the root belongs to the client.
# `workspaces` is this service's segment (the name without the qits- prefix); `api` is the second
# level that says "a JSON API", alongside `daemon` (the control socket) and `service` (the
# dev-server proxy), neither of which is one.
#
# The segment is spelled THREE times here — this key, quarkus.http.non-application-root-path, and
# quarkus.quinoa.ignored-path-prefixes — plus `routes:` in .config/qits/deployments.yml. The client
# no longer spells it at all: it is served at `/`.
#
# Note this key governs the JAX-RS routes only — the raw Vert.x ones register straight onto the
# router and do NOT follow it, which is what RootPath exists to reconcile. Both raw routes are
# prefixed by hand: ServiceProxyRoute serves ServiceProxyPath.PREFIX (/workspaces/service/), and
# CaptureCorsRoute derives its path from the prefix below so its preflight cannot drift off the POST
# it opens CORS for. The daemon control socket is a third: @WebSocket takes a literal,
# /workspaces/daemon/{id}.
#
# The value is spelled ONCE, as qits.rest.path, and quarkus.rest.path is derived from it — not the
# other way round, and not because an application-namespaced key reads better. quarkus.rest.path is
# a BUILD-TIME config item, and a build-time item is not in the runtime config of a native image:
# `@ConfigProperty(name = "quarkus.rest.path")` silently took its defaultValue of "/" in the binary,
# so CaptureCorsRoute registered on /capture — a path the gateway cannot reach — and the real
# endpoint at /workspaces/api/capture answered preflights with RESTEasy's bare 200 and no CORS
# headers at all. Every browser capture would have failed against the shipping artifact while the
# suite passed, because on the JVM fast-jar application.properties is an ordinary runtime config
# source and the same lookup succeeds. qits.rest.path is application-owned and runtime-phase, so it
# resolves in both. Read that one from code; let Quarkus have the derived copy.
qits.rest.path=/workspaces/api
quarkus.rest.path=${qits.rest.path}

# --- the API document -------------------------------------------------------------------------
# /q/* is what the framework serves rather than application code, and it sits OUTSIDE
# quarkus.rest.path — it moves only with this key. Same reason as above: the edge routes by prefix,
# and a document left at the root would now sit under the client's ui root and be shadowed by the
# SPA fallback. The document lands at /workspaces/q/openapi and the browsable UI at
# /workspaces/q/swagger-ui; quarkus.swagger-ui.path is relative by default and follows on its own,
# so do not pin it.
quarkus.http.non-application-root-path=/workspaces/q

# always-include because swagger-ui is a dev-mode-only extension by default, and the point of
# packaging these as processes is that each documents its own surface in a real deployment.
quarkus.smallrye-openapi.info-title=qits-workspaces API
quarkus.swagger-ui.always-include=true

# Prompt-draft attachments are uploaded through this service; the monorepo raised this app-wide and
# these routes inherited it.
quarkus.http.limits.max-body-size=64M

# --- the agent-activity rollup's ENDED state ------------------------------------------------------
# WorkspaceDaemonRegistry keeps a finished coding-agent session in the rollup instead of evicting it,
# because "just ended" is the state the agent-activity bar is ordered around — that workspace is the
# one waiting for your next prompt, and dropping it made it disappear at exactly that moment.
#
# The TTL is how long a session that stayed finished is still worth mentioning: long enough to
# survive a page reload and a coffee break (which is the whole reason the state lives on the server
# rather than being derived client-side from a transition to null), short enough that this morning's
# finished run is not still claiming a slot this afternoon. A live report always wins over it.
qits.workspace.agent-activity.ended-ttl-ms=1800000

# The sweep only ANNOUNCES the expiry — the rollup evaluates the TTL on every read, so the answer is
# already correct the instant it passes. This cadence is therefore a floor on how late the fade
# reaches an open browser, and nothing on this page polls, so without it a stale "Ended" would sit
# there until some unrelated hint fired.
qits.workspace.agent-activity.sweep-interval=60s

# --- the SPA ------------------------------------------------------------------------------------
# service/src/main/webui is the qits-spa-workspaces submodule (an Angular app), and Quinoa builds it
# during augmentation and serves the result from inside the artifact — so the UI ships with the
# service rather than as a second thing to deploy.
#
# It is rooted at "/". This service has a host of its own — workspaces.<env>.<domain> — so the
# client is what that host answers with, and the /workspaces segment is left to the machine surface.
# This key and the Angular build's baseHref are the same string in two repositories and have to move
# together — baseHref is what the bundle's own asset URLs are written against, so a mismatch loads
# index.html and then 404s every script it asks for. angular.json spells it `"baseHref": "/"`.
quarkus.quinoa.ui-root-path=/

# Deep links: without this, reloading on any client-side route 404s, because index.html is the only
# page on disk. The fallback route is registered last, so it only ever sees what no earlier route
# took, and it rewrites everything it does see to index.html.
quarkus.quinoa.enable-spa-routing=true

# --- what the SPA fallback must NOT swallow -------------------------------------------------------
# The ui root is `/`, so the fallback sees EVERY path this service does not otherwise serve — the
# machine surface included. The key is therefore not optional here and never can be: Quinoa derives
# its skip list from quarkus.rest.path and quarkus.http.non-application-root-path only, and both of
# those sit under /workspaces.
#
# The values are ABSOLUTE now. Quinoa strips ui-root-path before matching, and stripping `/` leaves
# the path as it is — so the entry is what the request actually spells. ONE entry does the whole job:
# a prefix match on /workspaces covers /workspaces/api (quarkus.rest.path), /workspaces/q
# (quarkus.http.non-application-root-path) and the four raw Vert.x / websocket literals —
# /workspaces/daemon, /workspaces/daemon/stream, /workspaces/service and /workspaces/container
# (AGENTS.md, "Where this service answers"). Add a route under /workspaces and there is nothing to
# do here; add a ROOT-level one and add its prefix in the same commit.
#
# What is at stake is a 404 rather than a 200 of text/html. A JSON client handed index.html parses a
# web page as data; measured against the packaged fast-jar before this key existed, GET
# /workspaces/daemon, /workspaces/daemon/ and /workspaces/daemon/{id} (a plain GET, no upgrade —
# websockets-next only claims the upgrade) all answered 200 text/html from the SPA. /service/ and
# /container/ did not, only because their proxy routes are catch-alls that answer everything under
# themselves; the one entry covers them anyway, because "nothing leaks today" is a property of those
# handlers and not of this config.
#
# Ignoring a prefix stops the SPA REROUTE; it does not unregister a route. Every upgrade and every
# proxy hop under /workspaces still works.
quarkus.quinoa.ignored-path-prefixes=/workspaces

# Where `ng build` leaves its output, relative to the ui dir. Quinoa's Angular detection derives the
# same value from angular.json (no `outputPath` set, so `dist/<project>/browser`), but it is spelled
# out because it is a coupling to the client's PROJECT NAME rather than to its repo name — a rename
# inside angular.json would otherwise make Quinoa package an empty client with nothing to say so.
# Every other Quinoa-serving service here spells it; this one was the odd one out.
quarkus.quinoa.build-dir=dist/qits-spa-workspaces/browser

# There is deliberately no quarkus.quinoa.package-manager-install here. Quinoa shells out to
# whatever `node`/`npm` is on PATH, and a local build must use the machine's own — setting the key
# in this file would make EVERY build download a node tarball, including `./mvnw package` on a
# developer machine that already has one. The one place with no node is the Mandrel builder stage in
# docker/Dockerfile, and that is where the two flags live, on the command line and pinned:
#
#     -Dquarkus.quinoa.package-manager-install=true
#     -Dquarkus.quinoa.package-manager-install.node-version=22.22.0
#
# So the download happens exactly where it is needed and nowhere else — the same arrangement every
# other Quinoa-serving service here uses (qits-ci's docker/Dockerfile is the reference). A build on a
# machine with no node fails at Quinoa's npm invocation rather than silently fetching one; that is
# the intended failure, and the fix is node on PATH, not this key.

# Two things that follow from the above and are worth knowing before they surprise someone:
#
#   Quinoa is DISABLED BY DEFAULT IN TESTS, so `mvn verify` neither builds nor serves the SPA. A
#   green suite says nothing about whether the UI is in the artifact — the same gap "mvn verify
#   passing does not mean the app starts" names for everything else here. Booting the binary and
#   asking for /workspaces/ is what tells you.
#
#   A checkout WITHOUT the submodule still builds. Quinoa warns and disables itself when
#   src/main/webui is missing, but throws "No package.json found in Web UI directory" when the
#   directory exists and is empty — which is exactly what `git clone` alone leaves behind for a
#   gitlink. `git submodule update --init` before building; README.md says so too.

# --- what a deployment MUST provide -------------------------------------------------------------
# qits.projects.url — where qits-projects answers. NOT defaulted, and the service refuses to start
# without it (HttpRepositoryLookup): a workspace is a branch of a repository, this context holds no
# foreign key into the repositories tables, so with no registry to ask every repository-scoped route
# would 404 and every create would fail. That is a misconfiguration wearing the costume of an empty
# system, so it fails closed instead. Dev and test tolerate it absent.
#
# The value is scheme, host and port with NO path — qits-projects serves its own /projects/api
# segment, so the same base url works whether this call goes direct on qits-net or through the
# gateway. Any value this repo picked would be wrong somewhere, which is why there is no default:
#
#   both processes on one host   QITS_PROJECTS_URL=http://localhost:8090
#   containers on qits-net       QITS_PROJECTS_URL=http://qits-projects:8080
#
# Not derived from anything, deliberately. Deriving one service's address from another's is the
# mistake qits-workspace-daemon's notes name outright: it fails as a 404, and a 404 from a registry
# is indistinguishable from an empty one.
#
# The REST client reads the address from THIS key rather than the other way round, for the reason
# CaptureCorsRoute learned the hard way a few lines up: an application-owned key is what a
# deployment sets, and it is runtime-phase in a native binary as well as on the JVM. The fallback is
# a deliberately unresolvable host, not a plausible default — with the address unset a production
# build has already failed at startup, and in dev/test HttpRepositoryLookup short-circuits before
# the client is called, so this value should never be dialled. If it ever appears in a stack trace,
# the bug is that something bypassed the check.
#
# `stork://qits-projects` is accepted here verbatim if service discovery is ever configured; that is
# the whole reason this is the declarative client and not a hand-rolled HttpClient.
quarkus.rest-client.qits-projects.url=${qits.projects.url:http://qits-projects.unconfigured.invalid}
# Bounded because this call sits on nearly every repository-scoped route: an unreachable registry
# has to fail fast enough to be an error rather than a hang. Both surface as a transport failure,
# which HttpRepositoryLookup deliberately does NOT read as "no such repository".
quarkus.rest-client.qits-projects.connect-timeout=2000
quarkus.rest-client.qits-projects.read-timeout=5000
#
# Note what this service has NO on-disk contract with any more: the shared volume of bare origins
# the git host serves. It neither reads nor writes it, there is no config key naming it, and a
# deployment does not mount it. Every ref this service moves is a push to qits.githost.url,
# because a filesystem ref update fires no post-receive and so produced no CI run for any branch
# create, merge or cleanup it ever performed. The one tree it opens is qits.workspaces.data-dir.
#
# And note the daemon control socket: /workspaces/daemon/ must be allow-listed for unauthenticated
# access at whatever fronts this service. It authenticates by workspace id, not by session — the
# callers are daemons inside workspace containers, which hold no user token by construction.
#
# --- what a deployment SHOULD provide -----------------------------------------------------------
# qits.githost.url — where the git host answers. Same shape as qits.projects.url above (scheme,
# host, port, NO path); the /git/<repoId> segment is qits-githost's own contract and is spelled in
# ConfiguredGitHostAddress. Defaulted in domain's microprofile-config.properties to the qits-net
# shape of the DEV environment, so a developer's process already works — but qits-githost is an
# environment service, so every other environment has to set it:
#
#   containers on qits-net       QITS_GITHOST_URL=http://dev-qits-githost:8080   (the default)
#   another environment          QITS_GITHOST_URL=http://prod-qits-githost:8080
#   both processes on one host   QITS_GITHOST_URL=http://localhost:8081
#
# It was QITS_ARTIFACTS_URL until the byte-plane split moved the git smart-HTTP server out of
# qits-artifacts. That name configures nothing now.
#
# It is the integrate flow's PUSH target, and it is defaulted rather than mandatory because the
# asymmetry with qits.projects.url is real: an unresolvable repository registry 404s every
# repository-scoped route, so it fails closed at startup, while an unreachable git host costs
# exactly one endpoint and says so when that endpoint is called.

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-workspaces` rather than qits-workspaces-service-<version>-runner, so
# `-Dnative` produces target/qits-workspaces and the process is identifiable in `ps` / `docker top`
# — which matters more here than elsewhere, since this host process sits beside a container per
# workspace and every one of them is also a qits binary. The failsafe plugin's native.image.path in
# service/pom.xml spells the same name; the two are the same string twice and move together.
quarkus.package.output-name=qits-workspaces
quarkus.package.jar.add-runner-suffix=false

# --- telemetry --------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path, exactly the
# shape qits.projects.url above already uses. The ingest path is qits-observability's own and
# belongs to the service, not to the deployment, so it is spelled once here and derived rather than
# configured. Point this at a collector or a different host and everything below follows.
#
# Unlike qits.projects.url this one IS defaulted and the service starts without it: a missing
# repository lookup 404s every repository-scoped route, while missing telemetry costs visibility
# and nothing else. Fail-closed is for what the service cannot do its job without.
qits.observability.url=http://qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is OtelReceiverResource over HTTP, and the
# exporter appends /v1/<signal> to this base — so this resolves to the three ingest routes at
# /observability/api/otel/v1/{traces,logs,metrics}.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default. The receiver decodes all three signals, and
# a log record correlated to a trace is most of why the receiver exists.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop the platform's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit. Console
# logging is untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one,
# which is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# That an ordinary logger call really becomes an exported OTLP record is proven once, in qits-events:
# its OtelLogBridgeTest decodes a real ExportLogsServiceRequest and PackagedLogBridgeIT repeats the
# claim against the packaged artifact. The same extension and the same four keys run here, so this
# repo guards the configuration rather than re-proving the behaviour — OtelLogConfigTest pins these
# values so drift cannot disable log export quietly.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# --- the platform event bus ----------------------------------------------------------------------
# This service publishes NOTHING and listens for nothing. It used to publish `SCMRelease` the instant
# a release push was accepted; the release door left this service on 2026-09-03 and qits-projects is
# the publisher now. What is still here of the qits-eventstream jar is the causation half — the
# persistence trio `domain`'s entities implement, and bus/EventstreamPushCausation, which stamps the
# ambient cause onto every push this service makes — plus the outbox's own datasource, which boots
# with the jar whether or not anything ever writes a row to it.
#
# NOTHING THE BUS NEEDS IS SPELLED HERE, deliberately. `qits.events.url`, the outbox's own datasource
# and Flyway lineage, the publish timeout and the retry budget all ship as defaults in that jar's
# META-INF/microprofile-config.properties at ordinal 100 — the same way `domain` ships its own — and
# a copy in this file would be a second place to change and a silent way for the two to drift. A
# deployment overrides them by env, unchanged by anything here: `QITS_EVENTS_URL` and
# `QUARKUS_DATASOURCE_EVENTSTREAM_JDBC_URL`.
#
# The one thing that CANNOT be left to that default in a container is the outbox's database path: the
# jar roots it at `${user.home}`, and this image has no passwd entry for its uid, so it resolves to
# `?` and the service dies at boot. docker/Dockerfile names it (/data/eventstream) for exactly the
# same reason it names QITS_WORKSPACES_DATA_DIR, and the header there argues it.
#
# What DOES belong here is the darkness, because the library ships enabled — a library that shipped
# dark would be one whose first deployment discovers it was never wired up — and the deployable is
# what owns where it is real. Same policy and same reasoning as the OTel keys above: a clone-alone
# `./mvnw verify` and a `quarkus:dev` have no qits-events on the far side, and enabled, a publish
# would pay the timeout dialling an unresolvable host and leave an outbox row for the sweeper to
# retry. Off means publish() is a debug line and the sweeper does nothing — there is no half-enabled
# state. It stays set even with no publisher in this service: the sweeper is the jar's, not ours.
%dev.qits.eventstream.enabled=false
%test.qits.eventstream.enabled=false

# --- talking to qits-containers -----------------------------------------------------------------
#
# Every workspace container and every workspace volume is the orchestrator's. This service holds no
# docker socket and spawns no process for any of it — containershost/WorkspaceContainers is the one
# adapter, and containers/ContainersClientProducer is where a token becomes a header.
#
# Where qits-containers answers, and the two deadlines, are NOT here: they ship as defaults in the
# client jar's own META-INF/microprofile-config.properties at ordinal 100 (qits.containers.url,
# qits.containers.client.request-timeout, qits.containers.client.ensure-timeout), the same
# arrangement qits-eventstream has. A copy in this file would be a second place to change. A
# deployment overrides them by env: QITS_CONTAINERS_URL.

# Who this process IS to the orchestrator, and the second half of every place it addresses.
#
# It MUST equal the `sub` of the machine token this service presents once the gate is on, because
# qits-containers' OwnerGuard compares them — so it defaults to reading quarkus.oidc-client.client-id
# below and the coupling lives in exactly one place, this line. It is also the scope: two
# environments sharing one docker daemon are dev-qits-workspaces and prod-qits-workspaces, and
# neither one's rows name the other's containers. Two instances must not share it.
qits.workspace.containers.owner=${quarkus.oidc-client.client-id:qits-workspaces}

# How long a launch holds through an orchestrator that cannot authorize it yet, or cannot be reached
# at all, asking again about every five seconds.
#
# The measured window is the trailing edge of a qits-platform-idp cutover: on 2026-08-12 the deploy
# train replaced the idp and qits-ci's next three step launches died with `refused 401` while every
# later one passed — this service's token, or the orchestrator's copy of the signing keys, belonged
# to the idp that had just been replaced. Each attempt asks the TokenSource again, which is the only
# way a post-cutover token is ever picked up. Retrying is safe for a reason a bare `docker run` never
# had: ensure is a PUT per (owner, workload, ref), so a second attempt addresses the same place and a
# container an unanswered attempt created is adopted rather than duplicated.
#
# It sits BESIDE the ensure deadline rather than inside it — that one is mostly an image pull — so
# the worst case is this window plus one whole ensure.
qits.workspace.containers.launch-patience=PT90S

# --- the editor's lifetime, and the switch that is off ------------------------------------------
# How long the EDITOR's container may sit idle before qits-containers' own IdleSweep stops it.
# BLANK IS THE SHIPPED VALUE and it means today's behaviour exactly: every workspace container keeps
# the EXPLICIT lifetime it has always had, nothing is swept, and the keepalive below does nothing.
# This is a kill switch that starts off, not a default somebody has to argue with.
#
# WHY THE EDITOR AND NOT EVERY WORKSPACE. A workspace is somewhere a person works and a coding agent
# runs unattended, so nothing but a person may end one. The editor's workspace is the one that is
# opened, read and left — a browser tab closed at the end of a day would otherwise hold a
# multi-gigabyte container for the week. The two are different statements about a container and the
# policy says so.
#
# STOPPING IS NOT LOSING, which is what makes this cheap enough to have at all. An idle-stopped place
# is STOPPED: the container keeps its id and its writable layer, /workspace is a volume of its own,
# and the ensure ladder's second rung starts it back up where it stands — the daemon then finds a
# checkout already there and clones nothing. The reopen path is code that already exists.
#
# IT RIDES THE POLICY, NOT THE SPEC. Recreate.ifChanged compares the spec, and the policy is not part
# of it, so turning this on does not replace a running container.
#
# These two keys live here rather than beside qits.editor.image-* in the domain jar's defaults
# because their reader is the orchestrator adapter, which is this module's.
qits.editor.idle-stop-after=

# How often one workspace may actually be touched while it is being used. An editor session is a
# stream of requests — a keystroke is a websocket frame — so a keepalive per request would cost more
# than the container it keeps. It MUST stay well under the deadline above: the sweep measures time
# since the last touch, so an interval near the deadline would let a busy editor be stopped between
# two touches. 30 seconds against a deadline measured in tens of minutes is the margin.
qits.editor.touch-interval=PT30S

# The inbound resource-server half follows the machine-auth rollout gate. A deployed platform turns
# it on for a commissioned workspace daemon's direct control WebSocket; clone-alone tests and local
# development keep using forward-auth without needing a live IdP.
qits.auth.machine.audience=qits-workspaces
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}
quarkus.oidc.auth-server-url=http://qits-platform-idp:8080/idp
quarkus.oidc.application-type=service
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=jwks
# The second value is the platform audience that a person's `qits` CLI token carries. Such a
# token gets in here too; its roles, not its audience, decide what it may do.
quarkus.oidc.token.audience=${qits.auth.machine.audience},qits-platform
quarkus.oidc.connection-delay=30S
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S

# --- the machine token this service presents ------------------------------------------------------
#
# Exactly one hop asks for a credential: qits-containers, which guards every route — reads included —
# on the caller's own identity. So quarkus.oidc-client.client-id is not a label here, it is this
# service's OWNER string, and qits.workspace.containers.owner above defaults to reading it.
#
# Shipped FALSE, exactly as qits-ci ships it: off, the extension builds a disabled client, the
# process boots with no secret and dials nothing, and the calls go out bare — which is what the
# orchestrator's own gate expects while that is off too. Turning it on is two environment variables
# and nothing else here moves:
#
#   QUARKUS_OIDC_CLIENT_CLIENT_ENABLED=true
#   QUARKUS_OIDC_CLIENT_CREDENTIALS_SECRET=<the secret qits-idp holds for this environment>
#
# The switch is read twice on purpose — by the extension, deciding whether to build a client, and by
# the producer, deciding whether to ask it for anything — because a second key of ours would be a
# second thing to get wrong.
quarkus.oidc-client.client-enabled=false

# Direct on qits-net, discovery off, so the path is given and is joined onto auth-server-url —
# `token`, not `/idp/token`.
quarkus.oidc-client.auth-server-url=http://qits-idp:8080/idp
quarkus.oidc-client.discovery-enabled=false
quarkus.oidc-client.token-path=token
quarkus.oidc-client.client-id=qits-workspaces
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.grant-options.client.audience=qits-containers

# Do not fetch a token at startup (the default does). Boot must not depend on the idp being up even
# once this is enabled — the first launch fetches, and quarkus-oidc-client caches and refreshes from
# there, so a restarted idp pauses new issuance and nothing else.
quarkus.oidc-client.early-tokens-acquisition=false

# The containers token is deliberately not reused for git: it has a containers audience. The named
# client keeps one service identity but requests qits-githost's audience, and disabled means the
# mirror fails before any anonymous HTTP request can leave this process.
quarkus.oidc-client.githost.client-enabled=false
quarkus.oidc-client.githost.auth-server-url=http://qits-idp:8080/idp
quarkus.oidc-client.githost.discovery-enabled=false
quarkus.oidc-client.githost.token-path=token
quarkus.oidc-client.githost.client-id=qits-workspaces
quarkus.oidc-client.githost.grant.type=client
quarkus.oidc-client.githost.grant-options.client.audience=qits-githost
quarkus.oidc-client.githost.early-tokens-acquisition=false

# Repository lookup is a third audience. The default client cannot be reused: its token is scoped
# to qits-containers, and qits-projects correctly rejects that token even though both clients name
# this same service identity.
quarkus.oidc-client.projects.client-enabled=false
quarkus.oidc-client.projects.auth-server-url=http://qits-idp:8080/idp
quarkus.oidc-client.projects.discovery-enabled=false
quarkus.oidc-client.projects.token-path=token
quarkus.oidc-client.projects.client-id=qits-workspaces
quarkus.oidc-client.projects.grant.type=client
quarkus.oidc-client.projects.grant-options.client.audience=qits-projects
quarkus.oidc-client.projects.early-tokens-acquisition=false

# --- the credential each workspace container holds ------------------------------------------------
#
# A workspace container is a dynamic context, so it gets an idp client of its own rather than a share
# of a durable one: commissioned when the container is provisioned, injected as
# QITS_COMMISSIONED_CLIENT_ID/_SECRET, given back when the container is torn down. wiring/
# IdpCredentialCommissioner is the implementation; the model is the superproject's
# authenticated-reads-plan.md.
#
# There is NO enable key of ours. quarkus.oidc-client.client-enabled above is read a third time here
# for the same reason it is read twice already: off, this process holds no secret, so it can
# authenticate against no commission API and nothing is commissioned — every container launches
# exactly as it did before, with no credential env at all.
#
# Where the commission API answers is DERIVED, not configured: it is qits-idp's own /api/clients
# under the very base this service already fetches tokens from. One address means the two can never
# name different idps.
quarkus.rest-client.qits-idp.url=${quarkus.oidc-client.auth-server-url}
# Bounded, and wider on the read than the registry's: a commission is one write per container launch,
# not a per-request lookup, and the launch has patience of its own around it (below).
quarkus.rest-client.qits-idp.connect-timeout=2000
quarkus.rest-client.qits-idp.read-timeout=10000

# How long a commission holds through an idp that cannot answer yet, asking again about every three
# seconds. The measured window is the same one qits.workspace.containers.launch-patience covers — a
# deploy train replacing qits-platform-idp, after which the next few calls answer 401 and the later
# ones pass. It is shorter than that one because it stands in front of it: a launch that spends this
# window and then the launch window is a person waiting.
qits.workspace.commission.patience=PT30S

# How often wiring/CommissionReconciler asks qits-idp what it is holding for this service and gives
# back whatever no live workspace container claims. Also runs once at boot, which is what catches a
# crash that lost a decommission. Hourly: a leaked credential is a credential nothing can use to
# reach a container that no longer exists, so this bounds how long one lingers rather than racing
# anything.
qits.workspace.commission.reconcile-interval=1h
