archetype: java-service
artifacts:
  - { type: docker, name: qits/qits-workspaces, sbom: .sbom/sbom.json }
# The provider golden masters (epic qits-112): the platform packages `golden-masters/` as
# `eu.wohlben.qits:qits-workspaces-golden-masters` and `@qits/workspaces-golden-masters`, each
# published only when its content changed. GoldenMasterRecordingTest keeps the directory current.
contracts:
  application: qits-workspaces
  golden-masters: { from: golden-masters/, packages: [maven, npm] }
  pacts:
    # qits-events-service's pact is the three-part
    # pacts/qits-workspaces-service_qits-eventstream-javalib_qits-events-service.json (qits-1163):
    # what the qits-eventstream library asks on this service's behalf, written by
    # service/src/test/.../wiring/EventstreamPactTest.
    qits-events-service: { packages: [maven] }
    qits-projects-service: { packages: [maven] }
    # qits-1149: this service's pacts against qits-idp, qits-containers and its workspace daemons
    # (testing/contracts/ConsumerPactFilesTest keeps each file current).
    qits-idp-service: { packages: [maven] }
    qits-containers-service: { packages: [maven] }
    qits-workspace-daemon: { packages: [maven] }
userflows: qits-workspaces
