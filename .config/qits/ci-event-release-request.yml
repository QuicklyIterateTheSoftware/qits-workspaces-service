# THE QA PIPELINE — this repository's only pipeline besides the release recipe, and it runs for
# RELEASE REQUESTS ALONE. It replaces ci-event-build.yml and ci-event-userflows.yml, both deleted in
# the commit that added this file. The reference template with the full argument is qits-ci's
# docs/ci-event-release-request.yml.
#
# THIS REPOSITORY USED TO HOLD THE RELEASE DOOR, so it is worth saying from here: the door left on
# 2026-09-03 and the release is a REQUEST in qits-projects now. That service folds `main`, the named
# branches and every released-but-unmerged tag onto a `release/<id>` branch through qits-githost's
# in-core primitives and publishes `ReleaseRequestChanged` per re-fold; this file is the QA that
# builds the fold. The merge primitive fires no post-receive and publishes no `SCMPublishCommit`, so
# without this event the fold would exist with nothing building it.
#
# Per-push CI is retired platform-wide with it: nothing builds a branch, because cd deploys what a
# RELEASE published rather than what a push built.
#
# DECIDE AT MAIN, BUILD AT THE FOLD. The file is discovered, parsed and selected at this
# repository's `main` head; only the run's branch and sha come from the payload. So a release
# request cannot alter the CI that gates it by folding in a commit that edits this file.
#
# ONE FILE, TWO HALVES, and "a red verify must not cost the image" still holds — bought with
# ORDERING plus PER-STEP CLASSIFICATION rather than with two files that cannot share a verdict. The
# gating build is FIRST; the userflow half declares `gating: false`, which still fails the run and
# shows red but does not hold the fold for qits-projects' build gate. Keep it LAST: everything after
# a failing step is SKIPPED.
#
# THE SHA IMAGE IS GONE, AND SO IS THE LOCAL TAG THAT OUTLIVED IT. The old build step ended in
# `docker push $QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-workspaces:$QITS_CI_SHA`, the per-push
# coordinate cd keyed on; a fold's merged sha is not a coordinate anything could deploy, so the push
# went and a local `-t qits-workspaces:<sha>` stood in as the gate's artifact. Under the platform
# builder there is no local image store to hold a tag either, so the build below declares no output
# at all: it builds every layer, proves the fold, exports nothing, and leaves the layers in the
# builder's cache. The CalVer coordinate is ci-event-release.yml's, and that file's matching build
# is what turns this cache into a fast release.
#
# Loop review: this pipeline PUTs a docs bundle and pushes no commit, no tag and no image — nothing
# the fold is made of changes, so it cannot re-trigger itself. Publish-if-absent: events redeliver
# and docs versions are immutable, so 409 is success.
event: ReleaseRequestChanged

when:
  # repoName, not repoId: the git host's own coordinate can be an opaque UUID since the identity
  # cutover, so a name match on repoId is not dependable. The event echoes the public name; a rename
  # updates this line in the same campaign. `suppressCi` went with the push event that carried it —
  # a release request is not a push and `-o qits.no-ci` has nothing to say about one.
  - repoName: { exact: qits-workspaces-service }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  # --- the GATING half: build the fold ------------------------------------------------------------
  # ci-event-build.yml's step, minus the push.
  #
  # TWO HALVES IN ONE STEP AND ONLY THE SECOND ONE MOVED. Half one builds the SPA bundle with npm,
  # here in the step container on qits-net, and needs nothing from any builder; half two is the
  # image, and it now runs on the platform's own buildkitd rather than on the host daemon's socket.
  # `build: true` is what declares that: qits-ci hands such a step $QITS_BUILD_REGISTRY and the
  # run's commissioned credential, qits-containers hands it $BUILDKIT_HOST, and the socket this step
  # used to hold is not mounted at all any more. qits-buildkit-plan.md in the wrapper is the whole
  # migration; qits-workspace-daemon's pipeline pair is the reference recipe.
  #
  # node-docker-base is still the right image and its name is now half a misnomer: node, npm and git
  # for half one, buildctl (which every step image ships) for half two, and the docker CLI it
  # advertises used by nothing below.
  #
  # `--network host` IS DELETED AND NOTHING REPLACES IT. It existed so a `RUN` in the builder stage
  # could reach the platform Maven repository and the Central mirror at addresses published on the
  # HOST's loopback. A `RUN` executes in the builder's namespace on qits-net now, so what the build
  # dials it dials by IN-NETWORK address — $QITS_MAVEN_REGISTRY_URL and $QITS_MAVEN_PROXY_URL below,
  # the two the step plane already carries. The Dockerfile's `FROM` lines keep their committed
  # edge-vhost spellings: the builder's own registry config rewrites them to the platform aliases
  # (qits-containers' buildkitd.toml carries the mapping), where the host daemon's registry-mirrors
  # used to.
  - image: qits/build-images/node-docker-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed build is swallowed
      # and the run reports SUCCESS — a green verdict for a fold that does not build is exactly what
      # a release gate must never be told (the exact shape of the qits-workspaces IMAGE_MISSING
      # incident, pointed one hop earlier). -u stops the step on an unset injected variable rather
      # than letting a build-arg be composed out of empty strings.
      set -eu

      # The builder, demanded loudly before either half runs. Unset means a qits-ci/qits-containers
      # pair too old to inject it; EMPTY means the kill switch (qits.ci.buildkit.enabled=false
      # spells off as empty-never-absent). Either way this step must fail here, naming the cause,
      # rather than fall back to a socket it no longer holds — and it must fail BEFORE the npm half
      # spends minutes producing a bundle nothing will consume. $QITS_BUILD_REGISTRY is demanded
      # even though nothing is pushed below: it is the pair's other half and an empty one means the
      # same switch is off.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"

      # $QITS_CI_BRANCH is release/<id> and $QITS_CI_SHA is the merged sha — the fold is already
      # checked out, so nothing here fetches or switches refs.
      #
      # The daemon's clone is `--depth 50` and does not recurse, so the qits-workspaces-frontend submodule
      # at service/src/main/webui arrives as an empty directory — and Quinoa fails the image build on
      # exactly that (`No package.json found in Web UI directory`). Initialising it here rather than
      # asking the daemon to clone differently keeps the submodule this repo's business: it is a
      # public GitHub repo needing no credentials, and one shallow fetch. (It was briefly private,
      # which an anonymous container reports as "could not read Username for 'https://github.com'" —
      # worth recognising if a sibling repo is ever born private too.)
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-workspaces-frontend"
      git -c submodule.qits-workspaces-frontend.url="$frontend_url" submodule update --init service/src/main/webui

      # THE LOCKFILE is the one file this step edits, and npm leaves no alternative. Same problem
      # and same fix as qits-workspaces-frontend's own pipeline — that repo's recipe is where this pattern
      # is maintained, and the two should keep matching.
      #
      # npm pins a full resolved URL per package, and qits-workspaces-frontend's lockfile is generated on
      # the deployment host, so every entry names a localhost port — an address that does not exist
      # in this container. `npm ci` fetches tarballs by that URL and never asks the configured
      # registry for them, so the environment below does not reach them: without this swap the
      # install dies on connection refused. The paths are identical on every address, so replacing
      # the ORIGIN and keeping the path is all it takes, and the integrity hashes are what make that
      # safe — bytes from the other address must still hash the same. The checkout is this step's
      # own; nothing is edited that anyone will ever read again.
      #
      # THE BYTE PLANE IS TWO SERVICES SINCE THE SPLIT, WHICH IS WHY THE SWAP READS THE PATH.
      # qits-platform-mirror holds the npmjs pull-through cache; qits-artifacts hosts the @qits
      # scope. No single origin serves both, so the path is what tells them apart: an entry under
      # the hosted registry's own pathname — $QITS_NPM_REGISTRY_URL's, /artifacts/npm/npm/ — is a
      # @qits tarball and gets the hosted origin, and every other entry gets the proxy's. One sed
      # covered both roots while they shared an origin; since the split it sends every @qits tarball
      # to the mirror, which has never held one: 404, on every run.
      #
      # THE ORDER OF THE TWO EXPRESSIONS IS THE WHOLE TRICK. sed applies -e in sequence per line, so
      # the broad proxy swap runs FIRST and the narrow path-anchored one corrects the @qits entries
      # after it. The other order lets the broad expression undo the narrow one.
      #
      # npm's own knob for exactly this, `--replace-registry-host=always`, cannot do it against a
      # registry mounted under a path, and could not have told two registries apart either.
      # @npmcli/arborist glues rather than resolves (reify.js:
      # `registry.slice(0, -1) + resolvedURL.pathname`), so
      # http://qits-platform-mirror:8080/artifacts/npm/npmjs/ + /artifacts/npm/npmjs/zone.js/-/…tgz
      # comes out as …/artifacts/npm/npmjs/artifacts/npm/npmjs/zone.js/-/…tgz and every tarball
      # 404s. Measured on npm 10.9.4.
      #
      # Every address is derived from the injected env rather than spelled here: no repository
      # states a deployment's addresses, and the two qits-workspaces-frontend does state (localhost:8081
      # for the @qits scope and localhost:8082 for npmjs, in its .npmrc, for a developer on the
      # host) are the ones being replaced.
      cd service/src/main/webui
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      # ENVIRONMENT, not a file. qits-workspaces-frontend COMMITS an .npmrc (localhost:8081 for @qits and
      # localhost:8082 for npmjs, right for a developer on the host), and npm ranks a project .npmrc
      # ABOVE ~/.npmrc — so a `cat > ~/.npmrc` preamble would be written and silently ignored.
      # `npm_config_*` environment outranks both files, so it wins without touching the submodule's
      # tree.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      # dist/qits-spa-workspaces/browser — the bundle the image build consumes, and the ONE artifact
      # this half exists to produce. Lint and test are qits-workspaces-frontend's own pipeline's job;
      # repeating them here would only make this repo red for someone else's commit.
      npm run build
      cd -

      # --- half two: the image ------------------------------------------------------------------
      # THE CREDENTIAL IS A SECRET AND NEVER A BUILD ARG — an arg is recorded in the image history.
      # The launcher injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET, and it reaches the
      # Dockerfile's mvnw RUN in FILE FORM on both sides: written here under umask 077 into /tmp —
      # outside the clone, so neither file can enter the build context — handed to buildctl as
      # `src=`, and mounted there as a bare file under /run/secrets. Never the `env=` mount form
      # either half of that used to use: it couples the recipe to whichever dockerfile frontend the
      # BUILDER chooses, and under the platform builder that choice is not this file's.
      #
      # Unconditional on purpose: a run that commissioned nothing writes two empty files, and
      # `.qits-maven-settings.xml` reads empty exactly as it reads unset — so these lines do nothing
      # at all until a run carries the pair. That is why they are `${VAR-}` and not `$VAR`: `set -u`
      # is above, a deployment with no oidc client sends neither variable, and the step must still
      # build green — the property the retired `--secret …,env=` flags had for free, since a missing
      # env source is not an error.
      umask 077
      printf '%s' "${QITS_COMMISSIONED_CLIENT_ID-}" > /tmp/qits-client-id
      printf '%s' "${QITS_COMMISSIONED_CLIENT_SECRET-}" > /tmp/qits-client-secret

      # NOTHING IS PUBLISHED HERE, AND NOW THERE IS NOT EVEN A TAG. The registry-qualified
      # `:$QITS_CI_SHA` coordinate was the per-push publication and retired with the push path; the
      # local tag that stood in for it has nowhere to live now, because `push=true` and no local
      # image store are the two halves of one arrangement. So this build declares no `--output` at
      # all: buildctl builds every layer, proves the fold, and exports nothing. The layers stay in
      # the builder's cache, which is what makes ci-event-release.yml's matching build of the
      # released tree a stack of cache hits. The CalVer coordinate is that file's.
      #
      # Both build-args are the IN-NETWORK routes, which is the whole of what `--network host` used
      # to buy: $QITS_MAVEN_REGISTRY_URL is the platform Maven repository as a container on qits-net
      # reaches it (it was `http://$QITS_REGISTRY/...`, the host-published name), and
      # $QITS_MAVEN_PROXY_URL is Maven Central's pull-through by the same reading (it was
      # $QITS_MAVEN_CENTRAL_MIRROR_URL, an edge vhost on the host loopback). Empty for the mirror —
      # an older qits-ci, or the mirror plane turned off — deactivates the settings profile and
      # Central is resolved directly, as it always was.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret

  # --- the NON-GATING half: verify the stories, and publish what the run observed -----------------
  # ci-event-userflows.yml's step, unchanged but for `gating: false`, which is the whole of what that
  # separate file was.
  #
  # `mvn verify` at the fold — which regenerates service/target/userstories/ through the whole story
  # catalogue — and the reports published as one docs bundle, site @userflows/qits-workspaces,
  # version = the merged sha, branch riding as artifacts metadata for discovery.
  #
  # ONE STEP, BECAUSE STEPS SHARE NOTHING. Every step container clones the repository for itself, so
  # the gating step above cannot hand this one anything: the verify and the publish stay together.
  #
  # `user: build`, and NOT a switch inside the script: the suites start zonky's embedded postgres,
  # initdb refuses to run as root and calls getpwuid, so the step needs a passwd-backed non-root
  # user — maven-base carries one (uid 1001). The step containers are Alpine, which is why `domain`
  # and `service` both name zonky's -alpine binaries as a fourth arch; `domain`'s matters as much as
  # `service`'s here, because its suite runs first and a missing arch would end this step two modules
  # before the IT. qits-eventstream's pipeline is the measured precedent for all of it.
  #
  # Quinoa is off (`-Dquarkus.quinoa=false` — the extension's root toggle; `.enabled` is not it): the
  # client is the gating step's business, this step never initialises the qits-workspaces-frontend
  # submodule, and the ITs assert nothing about the SPA. The packaged fast-jar failsafe boots is
  # otherwise exactly what ships.
  #
  # THE STORY CLASSES ARE OPTED IN BY NAME, and that is the one line here that differs from every
  # sibling repo's copy of this file. `skipITs` is true in the root pom and stays true: five of this
  # repo's *IT.java are the docker-backed `extended` suite (a real container, the published
  # qits/workspace image, the native daemon), and a bare `-DskipITs=false` would run them too — they
  # self-skip, but a step that shells `docker image inspect` five times is precisely what the
  # clone-alone rule forbids, and there is no docker in this container to shell. `-Dit.test` is a
  # COMMA LIST of the five classes that are about the artifact, and a story class added without being
  # added here simply never runs — silently, which is why AGENTS.md says to change both in one commit.
  # Only `service` binds failsafe executions, so no other module is asked for a test it does not have.
  #
  # The story catalogue needs `git` on PATH with `git http-backend` beside it: StoryGitHost shells the
  # CGI program git ships, to serve the fixture repositories over real smart HTTP — a packaged process
  # carries ConfiguredGitHostAddress and cannot be pointed at a bare on disk. maven-base has git; a
  # step image without it would fail every release story at the first ls-remote.
  - image: qits/build-images/maven-base:latest
    user: build
    gating: false
    timeout-seconds: 2400
    script: |
      set -eu
      # The platform registry, exactly as qits-eventstream's step derives it: the pom's default
      # names a host-published address unreachable from a step container, and the exact-id mirror
      # in .qits-maven-settings.xml is what passes Maven's HTTP blocker.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      # Maven Central through the platform mirror's in-network alias — empty (an older qits-ci that
      # injects nothing, or a deployment that turned the mirror plane off) deactivates the settings
      # profile and Central is resolved directly.
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -Dquarkus.quinoa=false \
        -DskipITs=false \
        -Dit.test=TokenValidationBootstrapIT,WorkspaceProvisionIT,EditorEnsureIT,OperatorReadsIT,MergeDoorRefusalIT

      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL. The path is the module's, since `service` is the only module
      # with stories in it.
      tar -czf userstories.tgz -C service/target/userstories .

      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the merged sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-workspaces" \
        "$QITS_DOCS_URL/@userflows/qits-workspaces/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-workspaces@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-workspaces@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
