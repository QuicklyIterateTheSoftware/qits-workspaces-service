          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such ACTIVE workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: The draft exceeds the configured byte cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Save
      tags:
      - Workspace Prompt Draft Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
    get:
      operationId: getAgentPromptDraft
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The saved draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response18"
        "404":
          description: "No such ACTIVE workspace, or it has no saved draft."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get
      tags:
      - Workspace Prompt Draft Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
    delete:
      operationId: deleteAgentPromptDraft
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: There is no draft for this workspace.
        "404":
          description: No such ACTIVE workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Delete
      tags:
      - Workspace Prompt Draft Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
  /workspaces/api/branches/cleanup:
    post:
      parameters:
      - name: repositoryId
        in: query
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleanupBranchRequest"
        required: true
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response3"
        "400":
          description: "The branch is not eligible: uncommitted changes, unmerged\
