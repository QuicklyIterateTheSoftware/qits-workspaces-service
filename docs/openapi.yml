      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
  /workspaces/api/branches/merge:
    post:
      parameters:
      - name: repositoryId
        in: query
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeBranchRequest"
        required: true
      responses:
        "200":
          description: Merged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response2"
        "400":
          description: "A blank, dash-leading or self-referential branch name."
