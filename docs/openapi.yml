            application/json:
              schema:
                $ref: "#/components/schemas/Resolution"
        "400":
          description: "A blank branch, or an old-model main workspace (refused on\
            \ both belts: no parent, or the repository's default branch)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
