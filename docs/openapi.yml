  securitySchemes:
    SecurityScheme:
      type: openIdConnect
      openIdConnectUrl: http://dev-qits-idp:8080/idp/.well-known/openid-configuration
      description: Authentication
paths:
  /workspaces/api/agent-dispatches:
    post:
      operationId: dispatchAgent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchAgentRequest"
        required: true
      responses:
        "200":
          description: "Dispatched. `fresh:false` means the branch already had a workspace\
            \ and it was answered instead — the ordinary case on a re-press, and not\
            \ an error. `agentIdentity` is the principal the dispatched agent's own\
            \ calls carry (the commissioned client id on a DIRECT workspace, the workspace\
            \ token's subject on a RUNNER one); null until the container is commissioned,\
            \ never a secret. A workspace on a workspace runner may answer `workspace.runtimeStatus:\
            \ QUEUED` with `agentLaunch: SCHEDULED`: it is waiting for a runner slot,\
            \ `technicalProcessId` is the start that queued it, and the agent is launched\
            \ once a runner takes it and its daemon answers. A re-press while it is\
            \ queued schedules nothing more."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispatch"
        "400":
          description: "A blank repository or branch, a branch name git will not take,\
            \ or a `gitRefs` list that breaks the rules (every entry under `refs/heads/`,\
            \ `*` only as a trailing `/*`, at most 500 entries of at most 255 characters,\
            \ no duplicates)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such repository. Nothing was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "RUNNER_UNAVAILABLE: the workspace already on that branch is\
            \ on a workspace runner that is offline past its reconnect grace; the\
            \ message names the runner. Nothing was started or queued: the workspace\
            \ is the runner's alone, so a dispatch fails rather than wait for it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Dispatch
      tags:
      - Agent Dispatch Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
  /workspaces/api/agent-dispatches/blocked:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkBlockedRequest"
        required: true
      responses:
        "200":
          description: "Answered. `workspaceId: null` means no workspace stands on\
            \ that branch; `applied: false` with a non-null `workspaceId` means the\
            \ daemon was not reachable or did not take the marker. Neither is an error\
            \ — this door never creates a workspace, ensures a container or starts\
            \ an agent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedMark"
        "400":
          description: A blank repository or branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Blocked
      tags:
      - Agent Dispatch Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
  /workspaces/api/agent-dispatches/delivery:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverTurnRequest"
        required: true
      responses:
        "200":
          description: "Answered. `workspaceId: null` means no workspace stands on\
            \ that branch — nothing was said and nothing was created, which is a normal\
            \ outcome and not an error. A workspace queued for a workspace runner\
            \ answers both flags false: the text waits until a runner takes it and\
            \ its daemon answers."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400":
          description: "A blank repository, branch or text."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "RUNNER_UNAVAILABLE: the workspace on that branch is on a workspace\
            \ runner that is offline past its reconnect grace; the message names the\
            \ runner. Nothing was said, started or queued."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Deliver
      tags:
      - Agent Dispatch Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
  /workspaces/api/agent-dispatches/entity:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkEntityRequest"
        required: true
      responses:
        "200":
          description: "Answered. `workspaceId: null` means no workspace stands on\
            \ that branch and nothing was stored; otherwise the facts are stored on\
            \ the workspace, and `applied` says whether its daemon also took them\
            \ live. Never creates a workspace, ensures a container or starts an agent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedMark"
        "400":
          description: "A blank repository or branch, or a missing or non-boolean\
            \ `blocked`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Entity
      tags:
      - Agent Dispatch Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
  /workspaces/api/agent-dispatches/references:
    get:
      parameters:
      - name: epicId
        in: query
        schema:
          type: array
          items:
            type: string
      - name: ticketId
        in: query
        schema:
          type: array
          items:
            type: string
      - name: workId
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: References
      tags:
      - Agent Dispatch Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
        - qits:agent
