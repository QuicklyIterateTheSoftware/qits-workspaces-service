          format: int64
        lastRunAt:
          $ref: "#/components/schemas/Instant"
        lastRunPromptVersion:
          type: integer
          format: int64
        lastRunCommandId:
          type: string
        updatedAt:
          $ref: "#/components/schemas/Instant"
    WorkspaceRunnerDto:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        description:
          type: string
        slots:
          type: integer
          format: int32
        workspaceMemoryLimit:
          type: string
        workspaceMemorySwapLimit:
          type: string
        version:
          type: string
        arch:
          type: string
        dotClaudeVolume:
          type: string
        login:
          $ref: "#/components/schemas/Login"
        registered:
          type: boolean
        registeredAt:
          $ref: "#/components/schemas/Instant"
        quarantined:
          type: boolean
        quarantinedAt:
          $ref: "#/components/schemas/Instant"
        quarantineReason:
          type: string
        eligible:
          type: boolean
        lastSeenAt:
          $ref: "#/components/schemas/Instant"
        lastHealthCheckAt:
          $ref: "#/components/schemas/Instant"
        lastHealthCheckOk:
          type: boolean
        createdAt:
          $ref: "#/components/schemas/Instant"
        connected:
          type: boolean
        connectedSince:
          $ref: "#/components/schemas/Instant"
        pinnedVersion:
          type: string
        running:
          type: integer
          format: int32
        owned:
          type: integer
          format: int32
        queued:
          type: integer
          format: int32
        loginCommand:
          type: string
        kimiLoginCommand:
          type: string
        loginCommandPending:
          type: boolean
        health:
          $ref: "#/components/schemas/Health"
    WorkspaceRunnerHealthDto:
      type: object
      properties:
        at:
          $ref: "#/components/schemas/Instant"
        ok:
          type: boolean
        detail:
          type: string
        requestId:
          type: string
        dataOmitted:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckReport"
    WorkspaceRunnerRefDto:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
    WorkspaceRuntimeStatus:
      type: string
      enum:
      - RUNNING
      - STOPPED
      - PROVISIONING
      - FAILED
      - QUEUED
      - UNAVAILABLE
    WorkspaceStatus:
      type: string
      enum:
      - ACTIVE
      - INTEGRATED
      - ABANDONED
  securitySchemes:
    SecurityScheme:
      type: openIdConnect
      openIdConnectUrl: http://dev-qits-idp:8080/idp/.well-known/openid-configuration
      description: Authentication
paths:
  /workspaces/api/agent-dispatches:
    post:
      operationId: dispatchAgent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchAgentRequest"
        required: true
      responses:
        "200":
          description: "Dispatched. `fresh:false` means the work item already had\
            \ an ACTIVE agent and it was answered — a re-press, not an error. `agentLaunch`\
            \ is SCHEDULED (the agent has a workspace and starts, or hears the instruction,\
            \ once its daemon answers), SKIPPED_RUNNING (it was already running; the\
            \ instruction was not sent) or QUEUED (no workspace slot is free; `agent.workspaceRowId`\
            \ is null until one is). `agentIdentity` is the subject of the agent's\
            \ own credential; null while it holds none."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispatch"
        "400":
          description: "A blank repository, wrapper branch or work item, a branch\
            \ git will not take, or `admin: true` (admin agents come only from `POST\
            \ /workspaces/api/agents`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such repository. Nothing was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Dispatch
      tags:
      - Agent Dispatch Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
  /workspaces/api/agent-dispatches/blocked:
    post:
      operationId: markAgentDispatchBlocked
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkBlockedRequest"
        required: true
      responses:
        "200":
          description: "Answered. `agentId: null` means no agent works on the item;\
            \ `applied` says whether the running harness took the marker live. Never\
            \ creates or starts anything."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityMark"
        "400":
          description: A blank work item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Blocked
      tags:
      - Agent Dispatch Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
  /workspaces/api/agent-dispatches/delivery:
    post:
      operationId: deliverAgentTurn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverTurnRequest"
        required: true
      responses:
        "200":
          description: "Answered. `agentId: null` means no agent works on the item:\
            \ nothing was said and nothing created — a normal outcome. Otherwise one\
            \ of `delivered` (queued for the running agent: said once it is not busy,\
            \ or after the launch window), `launched` (its first turn, once it starts)\
            \ or `resumed` (a yielded agent resumes to hear it)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400":
          description: A blank work item or text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: A `qits:desk` caller whose token's `project` claim is not the
            item's ACTIVE agent's project. Nothing was said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
      summary: Deliver
      tags:
      - Agent Dispatch Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
        - qits:desk
  /workspaces/api/agent-dispatches/entity:
    post:
      operationId: markAgentDispatchEntity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkEntityRequest"
        required: true
      responses:
        "200":
          description: "Answered. `agentId: null` means no agent works on the item\
            \ and nothing was stored; otherwise the facts are stored on the agent\
            \ (the cleanup sweep reads the status), and `applied` says whether its\
            \ running harness took them live."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityMark"
        "400":
          description: "A blank work item, or a missing or non-boolean `blocked`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Entity
      tags:
      - Agent Dispatch Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
  /workspaces/api/agent-dispatches/references:
    get:
      operationId: listAgentDispatchReferences
      parameters:
      - name: epicId
        in: query
        schema:
          type: array
          items:
            type: string
      - name: ticketId
        in: query
        schema:
          type: array
          items:
            type: string
      - name: workId
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response1"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: References
      tags:
      - Agent Dispatch Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
        - qits:agent
  /workspaces/api/agents:
    get:
      summary: "Agents, newest first, each filter optional"
      operationId: listAgents
      parameters:
      - name: state
        in: query
        schema:
          $ref: "#/components/schemas/AgentState"
      - name: workId
        in: query
        schema:
          type: string
      - name: workspaceId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Agent Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
        - qits:agent
    post:
      operationId: createAgent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
        required: true
      responses:
        "200":
          description: "The agent: created, or the item's ACTIVE agent (`fresh:false`).\
            \ Same answer as the dispatch door."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispatch"
        "400":
          description: "No work item, or a wrapper branch git will not take."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Create
      tags:
      - Agent Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
  /workspaces/api/agents/{agentId}/waits:
    get:
      summary: "The agent's waits, optionally of one state"
      operationId: listAgentWaits
      parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      responses:
        "200":
          description: "The agent's waits, newest first."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitList"
        "403":
          description: An agent's credential reading another agent's waits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
      tags:
      - Agent Wait Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
        - qits:agent
    post:
      summary: Declare what the agent waits on
      operationId: createAgentWait
      parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWaitRequest"
        required: true
      responses:
        "201":
          description: "The wait, OPEN."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitView"
        "400":
          description: "An invalid selection (the matcher's reason), or a bad timeout."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An agent's credential acting on another agent's waits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: AGENT_NOT_ACTIVE (the agent is OBSOLETE or REMOVED) or TOO_MANY_WAITS
            (8 are OPEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
      tags:
      - Agent Wait Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
        - qits:agent
  /workspaces/api/agents/{agentId}/waits/{waitId}:
    delete:
      summary: Cancel one of the agent's waits
      operationId: cancelAgentWait
      parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
      - name: waitId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The wait: CANCELLED, or as it was when already closed. No\
            \ turn is given."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitView"
        "403":
          description: An agent's credential cancelling another agent's wait.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "No such agent, or no such wait of it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
      tags:
      - Agent Wait Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
        - qits:agent
  /workspaces/api/agents/{id}:
    get:
      operationId: getAgent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The agent, in any state."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDto"
        "404":
          description: No such agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Get
      tags:
      - Agent Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:system
        - qits:agent
  /workspaces/api/agents/{id}/discard:
    post:
      operationId: discardAgent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscardAgentRequest"
        required: true
      responses:
        "200":
          description: "Removed: worktrees, credential and draft gone."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDto"
        "409":
          description: "AGENT_BUSY (harness still working in the background), AGENT_HAS_LEFTOVER_WORK\
            \ (uncommitted or unpushed work, named) or AGENT_DAEMON_UNREACHABLE; nothing\
            \ was removed. Send `force: true` to remove anyway."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      summary: Discard
      tags:
      - Agent Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
  /workspaces/api/agents/{id}/prompt-attachments:
    get:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The attachments, oldest first."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response16"
        "404":
          description: No such ACTIVE workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: List
      tags:
      - Workspace Prompt Attachment Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
    post:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAttachmentRequest"
        required: true
      responses:
        "201":
          description: Attached; the row without its bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response15"
        "400":
          description: "Not valid base64, not a PNG or JPEG, or an unknown source."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such ACTIVE workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: The image exceeds the configured per-image byte cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Add
      tags:
      - Workspace Prompt Attachment Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
  /workspaces/api/agents/{id}/prompt-attachments/{attachmentId}:
    put:
      parameters:
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAttachmentRequest"
        required: true
      responses:
        "200":
          description: Updated; the same row id is preserved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response15"
        "400":
          description: "Not valid base64, not a PNG or JPEG, or an unknown source."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "No such ACTIVE workspace, or no such attachment on it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: The image exceeds the configured limit.
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Update
      tags:
      - Workspace Prompt Attachment Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
    delete:
      parameters:
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed.
        "404":
          description: "No such ACTIVE workspace, or no such attachment on it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Delete
      tags:
      - Workspace Prompt Attachment Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
  /workspaces/api/agents/{id}/prompt-attachments/{attachmentId}/content:
    get:
      parameters:
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The stored PNG or JPEG bytes.
          content:
            image/png: {}
            image/jpeg: {}
        "404":
          description: "No such ACTIVE workspace, or no such attachment on it."
          content:
            image/png:
              schema:
                $ref: "#/components/schemas/ApiError"
            image/jpeg:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      summary: Content
      tags:
      - Workspace Prompt Attachment Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:agent
  /workspaces/api/agents/{id}/prompt-draft:
