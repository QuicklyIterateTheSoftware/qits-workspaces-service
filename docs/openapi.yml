        lastHealthCheckAt:
          $ref: "#/components/schemas/Instant"
        lastHealthCheckOk:
          type: boolean
        createdAt:
          $ref: "#/components/schemas/Instant"
        connected:
          type: boolean
        connectedSince:
          $ref: "#/components/schemas/Instant"
        pinnedVersion:
          type: string
        running:
          type: integer
          format: int32
        owned:
          type: integer
          format: int32
        queued:
          type: integer
          format: int32
        loginCommand:
          type: string
        kimiLoginCommand:
          type: string
        loginCommandPending:
