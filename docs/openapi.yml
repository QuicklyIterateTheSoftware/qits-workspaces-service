            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The target is the repository's default branch. `reason` is
            RELEASE_REQUIRED and the message names the release flow that does write
            it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
