# Workspaces config defaults, shipped from this library jar.
#
# Library jars ship defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's
# application.properties is ignored — read by whichever app pulls the jar in. The consuming app's
# own application.properties (ordinal 250) and the environment override any of these.

# --- persistence ------------------------------------------------------------------------------
# This context owns its OWN named datasource + persistence unit + Flyway lineage: its own PostgreSQL
# database, never sharing qits' default DB or its migration history (the artifacts/ci precedent).
# Because it is a separate physical DB, workspace.repository_id is a plain String column with NO
# cross-boundary FK.
#
# THE THREE KEYS BELOW ARE THE PLATFORM'S GENERIC RESOURCE CONTRACT. This repository declares
# `resources: postgresql:db` in .config/qits/deployments.yml; qits-deployments creates the role and
# the database (`qits_workspaces`, the name derived from the application) before the cutover and
# injects QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD into the container it starts. Nothing in the
# deployer is workspaces-specific — an application maps the generic variables in its own shipped
# defaults, and this is where this one does it. The variable names follow the resource NAME, so
# renaming the resource in the spec stops matching this file.
#
# THE TRIPLE HAS NO DEFAULTS AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming what is missing,
# rather than opening some fallback store nobody meant.
#
# THAT STANCE IS WHAT RETIRES THIS FILE'S WORST BUG CLASS, and the previous value is worth
# remembering rather than deleting. It was `jdbc:h2:file:${user.home}/...`, and `${user.home}` in a
# native image with no /etc/passwd entry for uid 1001 resolves to `?` — a boot failure only the
# packaged artifact in its real environment ever saw. The same url once carried AUTO_SERVER, which
# killed the first native binary this repo produced: H2's TcpServer is loaded by name and is not in
# the image, so the process died on its first connection, and it would additionally have opened a
# database port on the host that attaches workspace containers to qits-net. Every JVM test stayed
# green through both, because the suite overrode the url and never opened the shipped one. A default
# with no feature in it cannot lose one.
quarkus.datasource.workspaces.db-kind=postgresql
quarkus.datasource.workspaces.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.workspaces.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.workspaces.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER, WHICH STOCK AGROAL DOES NOT. Replacing the tier's postgres
# severs every pooled connection; without validation the pool hands a dead one to the next caller
# long after the database is back, and 5s of acquisition is not enough for the successor to take the
# alias. Validate at borrow, and wait 15s before giving up.
#
# THREE LINES, AND ALL THREE ARE NEEDED — the platform's datasource baseline, enforced by
# DatasourceBaselineTest in the `service` module. PatientPgDriver delegates to pgjdbc and HOLDS a
# connection request while postgres is coming back, retrying only "the database is not there"
# (refused, unreachable, 57P03 "starting up") until a deadline deliberately under the acquisition
# timeout, so a caller still gets the real refusal rather than a generic pool message. Measured:
# Agroal does NOT spend its acquisition budget on a failed connection CREATION, so the two lines
# above alone never held anything. validate-on-borrow is what turns a dead pooled connection into a
# fresh creation attempt — which is the thing the driver makes patient — and acquisition-timeout is
# what keeps the pool's waiter alive while it works. Miss one and the other two do less than they
# read as. The measurements are in the superproject's db-patience-plan.md.
quarkus.datasource.workspaces.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.workspaces.jdbc.acquisition-timeout=15S
quarkus.datasource.workspaces.jdbc.validate-on-borrow=true

# A dedicated persistence unit bound to that datasource, owning only this module's entities.
quarkus.hibernate-orm.workspaces.datasource=workspaces
quarkus.hibernate-orm.workspaces.packages=eu.wohlben.qits.workspaces.entity

# Own Flyway lineage at a distinct classpath location so it never mixes with domain's db/migration.
# ONE lineage: the move to postgres is a clean start, so there is a single V1 and no history
# inherited from the four H2 files (see V1__init.sql's header for why that was allowed).
#
# baseline-on-migrate is GONE with that lineage. It told Flyway to adopt a non-empty schema it had no
# history table for, which the H2 file needed while it was being adopted; every database this code
# now meets is empty or was created by this very lineage, and the flag would only mask the one case
# worth failing on — a schema somebody else put there.
quarkus.flyway.workspaces.migrate-at-start=true
quarkus.flyway.workspaces.locations=classpath:db/workspaces/migration

# --- this service's own data tree ----------------------------------------------------------------
# Where the git mirrors live (one per repository, plus the worktrees a merge runs in) and where the
# workspace metadata sidecars are written. Private to this service, beside its database and its
# event outbox, on the volume it already owns.
qits.workspaces.data-dir=${user.home}/.qits/data/workspaces

# This is the ONLY tree this service opens. There was a second key here, naming the shared volume of
# bare origins qits-artifacts serves, and it is gone because there is nothing left to point at it.
# Every repository operation (a branch create, a branch delete, a merge, a release) is a push to the
# git host over HTTP, and the volume's last reader — the sidecar fallback in WorkspaceMetadataStore —
# went with the sidecars that had already moved off it.

# --- where the git host answers -------------------------------------------------------------------
# Scheme, host and port with NO path — the same shape qits.projects.url and qits.observability.url
# already use, so one value works whether the call goes direct on qits-net or through the gateway.
# The /git/<repoId> segment is qits-githost's own contract and is spelled in
# ConfiguredGitHostAddress, not here: it belongs to the git host rather than to a deployment.
#
# The key is qits.githost.url and was qits.artifacts.url until the byte-plane split moved the git
# smart-HTTP server out of qits-artifacts into a service of its own. Renamed rather than repointed
# on purpose: a deployment still passing QITS_ARTIFACTS_URL now configures nothing and takes this
# default, instead of aiming every ref this service moves at a service that no longer serves git.
#
# This is the push target of the integrate flow, and it exists because integrate deliberately does
# NOT advance the default branch by writing the ref in the bare origin this service already holds.
# That shortcut is what today's merge does, and it is why no merge this service ever performed
# produced a CI run: a filesystem ref update fires no post-receive. Pushing through the ordinary git
# host makes receive-pack the sole writer of the default branch, so the protection hook sees every
# release and the existing post-receive -> qits-ci -> build chain happens for the ordinary reason.
#
# Defaulted, unlike qits.projects.url, and the asymmetry is deliberate: an unresolvable repository
# registry 404s every repository-scoped route, so it fails closed at startup, while an unreachable
# git host costs exactly one endpoint and says so when it is called. The default is the qits-net
# shape because that is where this service runs in a deployment; a host-run process overrides it.
#
# It carries an ENVIRONMENT, because qits-githost is an environment service: it is deployed once per
# environment as <env>-qits-githost and only a deployment knows which one. So this default is the
# dev spelling — right for a developer's process against the standing environment, and a placeholder
# everywhere else. A deployment's run-args own the real value.
qits.githost.url=http://dev-qits-githost:8080

# The per-workspace Git helper requests this audience when it exchanges the workspace's
# commissioned client for a short-lived bearer. Deployment wiring qualifies it by environment.
qits.githost.audience=qits-githost

# Containers use the platform edge for Git so its oauth2 Basic transport is rewritten to a Bearer
# before reaching githost. Direct githost access stays reserved for service callers with Bearers.
qits.workspace.container-git-url=http://qits-platform-edge:8080

# The package registries a workspace BUILDS against, dialled by their qits-net aliases. Blank means
# unset, and unset means nothing is injected: a container then behaves exactly as it did before
# these keys existed. There is deliberately no shipped default — the artifacts alias carries the
# environment name and the npm proxy is a platform service that does not, so a default here would be
# a guess at the deployment's own topology. Deployment wiring supplies all three
# (qits-cli-bootstrap writes them into the deployer's extras for qits-workspaces).
#
# Without them a workspace build fails in two distinct ways, both far from their cause: Maven
# refuses the repositories' plain-http `qits-maven` outright ("Blocked mirror ... from/to
# maven-default-http-blocker"), and npm resolves the public registry, where the @qits scope does not
# exist. The image turns the Maven address into a usable -s; these keys only say where.
qits.workspace.maven-repository-url=
qits.workspace.npm-registry-url=
qits.workspace.npm-proxy-url=

# Maven Central through qits-platform-mirror's pull-through cache, injected as
# QITS_MAVEN_CENTRAL_URL. The workspace image's /etc/qits/maven-settings.xml already carries the
# mirror entry and the profile that puts qits-central in stock Central's place; this address is the
# only half it is missing, and the profile activates ONLY on a NON-EMPTY value (measured on Maven
# 3.9: an empty environment value does not activate a property-presence profile). So the two halves
# are: non-blank ⇒ every workspace build resolves Central through the mirror; BLANK ⇒ nothing is
# injected, the profile never activates, and a build reaches repo1.maven.org directly, exactly as it
# did before this key existed. Blanking it is the off switch and there is no other one.
#
# Shipped NON-EMPTY, unlike the three keys above, and the asymmetry is the same reasoning read the
# other way: their addresses carry an environment name, so a default would be a guess at the
# deployment's topology, while qits-platform-mirror is a platform service deployed once under a name
# with no environment in it — and a workspace container sits on qits-net, so this is the address
# everywhere. The mirror plane is on by default platform-wide (qits-ci ships its two equivalents
# non-empty); a workspace was the last builder still going out to Central directly.
#
# Environment is part of the container spec, so this value must stay a CONSTANT: qits-containers
# recreates a container whose spec changed under Recreate.ifChanged, and a value derived per call
# would turn every ensure into a replacement.
qits.workspace.maven-central-url=http://qits-platform-mirror:8080/mirror/maven/central

# Every git call that talks to the git host — the mirror's clone and fetch, ls-remote, and every
# push — carries this deadline. One key rather than one per verb: they are the same failure, a
# wedged host pinning a request thread, and release, integrate and the workspace listing all answer
# synchronously. Local git inside the mirror keeps its unbounded wait, where a bound would only turn
# slow into broken.
#
# It replaces qits.workspace.integrate.push-timeout-ms, which named the one network call this
# service used to make. Nothing sets that key in any deployment; the rename is the widening.
qits.workspace.git.network-timeout-ms=120000

# How long a fetched mirror is trusted before a read refreshes it again. It bounds one thing: how
# stale an ahead/behind count or a conflict warning on the branch list may be. Nothing that DECIDES
# anything reads through it — branch existence is an ls-remote against the git host, and every flow
# about to write forces a refresh first. The window exists because the workspace listing computes
# ahead/behind for every workspace of a repository and a browser polls it.
qits.workspace.git.mirror-freshness-ms=5000

# How long an integrate waits for a repository another one (or a pull/sync) is holding. The lease is
# not what makes concurrent integrates safe — the push is a compare-and-swap, so git rejects the
# loser either way — it is what turns "one of two fails" into "one waits". Capped so the wait cannot
# become the unbounded one the push timeout above exists to forbid.
qits.workspace.integrate.lease-wait-ms=60000

# --- the workspace container --------------------------------------------------------------------
# The image every workspace container runs. Its ENTRYPOINT is the workspace-daemon binary, with no
# `sleep infinity` fallback: a container whose daemon cannot start is not a usable workspace.
#
# THE REGISTRY HOST IS PART OF THE VALUE, which is the one thing here that looks wrong, so: artifact
# *declarations* are unqualified on purpose, because the registry is spelled one way inside a step
# container and another way outside it, and a declaration must not pick a side. This is not a
# declaration. It is a runtime reference. qits-workspaces hands this exact string to `docker run` on
# the HOST daemon, through the mounted socket, so it has to be spelled the way the HOST daemon
# resolves it — which is the same `registry.dev.localhost:8080` that $QITS_REGISTRY already carries
# for qits-ci and qits-deployments. The registry sits behind the edge proxy now and has no
# host-published port of its own; the host daemon resolves the vhost and carries it in
# insecure-registries. There is no ambiguity left to preserve at this point in the flow.
#
# UNQUALIFIED WOULD BE THE BUG. A bare name resolves against whatever happens to sit in the host's
# local image store, and that is precisely the drift this removes: `qits/workspace:latest` was a
# hand-built tag on one machine, and nothing recorded which daemon build was inside it. The image is
# a released artifact now — qits-workspace-daemon's CI builds it from the published toolchain base
# plus the published daemon binary and pushes it — so there is a real reference to name.
#
# PINNED TO A VERSION, not a floating tag, because a workspace container should be reproducible: one
# qits-workspaces release must always start one workspace image, and a `latest` moving underneath
# makes "which daemon is in there" unanswerable all over again. The reference is composed from two
# keys: -repo (the registry host and path above) and -version (the calver tag). The factory joins
# them as `<repo>:<version>`, so the value handed to the host daemon is byte-identical in shape to
# the old single key.
#
# THE VERSION FOLLOWS THE DAEMON THROUGH qits-configuration, not through this file. The version below
# is a fallback DEFAULT only. At runtime the deployer injects QITS_WORKSPACE_IMAGE_VERSION — sourced
# from qits-configuration, which the qits/workspace image's own SoftwareRelease event keeps in step —
# and SmallRye maps that env var onto qits.workspace.image-version automatically, so the injected
# value WINS over the default here. This replaced the old `sed`-rewrite follow train
# (.config/qits/ci-event-upstream-workspace-daemon.yml, now deleted): nothing rewrites this file on a
# daemon release any more, so neither key's shape is load-bearing for a `sed`.
#
# THE NAME IS qits/workspace, NOT qits/workspace-daemon. Two images come out of one pipeline
# (qits-workspace-daemon's .config/qits/ci-event-release.yml declares both): the daemon image is the
# small one qits-deployments reads, and this is the layered one — the released toolchain with the
# daemon copied in as its entrypoint. Only the second is startable as a workspace.
qits.workspace.image-repo=registry.dev.localhost:8080/qits/workspace
qits.workspace.image-version=2026.820.155203

# --- the editor image ---------------------------------------------------------------------------
# The image the PROJECT WRAPPER'S MAIN WORKSPACE runs, and nothing else does: qits/workspace-editor,
# which is qits/workspace with openvscode-server unpacked at /opt/openvscode-server and no other
# difference — same entrypoint, same user, same workdir. So a workspace with an editor is an
# ordinary workspace container that happens to carry an editor binary, and everything qits-workspaces
# does to it is unchanged.
#
# A SECOND PAIR OF KEYS, NOT A SUFFIX ON THE FIRST. Two repositories publish these two images on two
# calvers — qits-workspace-daemon publishes qits/workspace, and qits-workspace-editor-oci follows it
# one release later with a version of its own — so a derived name (`${image-repo}-editor`) would tie
# the versions into one string and be wrong the moment either train ran alone. Everything the
# workspace pin's comment above says about qualifying the registry host applies here verbatim: this
# is a runtime reference handed to a docker daemon, not an artifact declaration.
#
# WHO CHOOSES IT is not this file. WorkspaceContainerFactory picks the editor reference exactly for a
# workspace whose posture is wrapper-main (repository archetype PROJECT + branch == that repository's
# main branch), and the plain reference for every other. There is no key that widens it and no flag
# on a launch — see WorkspacePostures for why the answer has to be derivable at EVERY ensure.
#
# THE VERSION FOLLOWS THE IMAGE THROUGH qits-configuration, exactly as the workspace pin does: the
# value below is a fallback DEFAULT and the deployer injects QITS_EDITOR_IMAGE_VERSION, which
# SmallRye maps onto qits.editor.image-version so the injected value wins.
#
# THE DEFAULT BELOW NAMES NOTHING YET, AND SAYS SO. qits-workspace-editor-oci has never been
# released, so no tag exists under qits/workspace-editor at any version. What is written here is the
# calver of the qits/workspace release its Dockerfile is currently pinned FROM — so the placeholder
# at least states which toolchain generation the editor is meant to sit on, instead of inventing a
# number. THE FIRST REAL RELEASE SUPERSEDES IT through the train above and this line stops mattering.
# Until then a wrapper-main workspace fails at the orchestrator's pull with 409 IMAGE_MISSING, which
# is the loud version of the same absence — the same posture the workspace pin shipped with.
qits.editor.image-repo=registry.dev.localhost:8080/qits/workspace-editor
qits.editor.image-version=2026.823.71954

# The loopback port the in-container editor listens on, forwarded to the daemon as
# QITS_WORKSPACE_DAEMON_EDITOR_PORT. One key, because the two ends must agree on one number; it
# equals the daemon's own shipped default, so a container launched before this key existed answers
# where this expects it. The host's editor proxy does NOT dial it — the port is loopback inside the
# container and the proxy asks the reverse tunnel for the listener by NAME (StreamTarget.EDITOR).
qits.editor.port=13339

# How long EditorProxyTargets keeps "this project label names no wrapper repository".
#
# The scan behind that answer is one qits-projects call per ROOT repository, and a browser sitting on
# an editor origin whose main workspace does not exist yet reloads twice a second — so uncached it is
# N round trips twice a second, per tab, to keep saying 404.
#
# THE TTL IS THE BACKSTOP AND NOT THE INVALIDATION. A miss is kept against the candidate set it was
# computed over (the root repositories, one indexed local query), and everything the scan reads about
# a repository in that set is immutable — so the answer can only have changed when the set has, and a
# main workspace created a second ago resolves at once instead of waiting out a window. This bound is
# for the label nobody ever registers on a platform whose root workspaces are not moving. A scan the
# registry could not answer is never remembered at all.
qits.editor.label-miss-ttl-ms=5000

# There is no qits.workspace.container-runtime any more, and no qits.workspace.image-pull-timeout-ms.
# The first named the binary this service shelled out to and the second bounded the `docker pull` in
# front of a `docker run`; this service shells nothing and pulls nothing. qits-containers owns the
# daemon, and it pulls the pin itself under pull policy MISSING — which is the same inspect-then-pull
# rule, enforced one hop out where the daemon actually is. A deployment that still sets either key
# is setting a key nothing reads.

# How a container addresses qits itself — the git host it self-clones from, and the control socket
# it dials home on. `auto` resolves host.docker.internal (Linux gets the --add-host alias).
qits.workspace.git-host=auto
qits.workspace.qits-port=8080
qits.workspace.network=qits-net

# qits.workspace.container-network is gone with the `bridge-ip` mode it selected. That mode read a
# container's IP off a `docker inspect` for plain-Linux hosts where the bridge is host-routable —
# there is no inspect to make now, and under the swarm overlay this platform runs on there is no
# host-routable bridge address either. What is left is the mode every deployment already used: the
# container's DNS name on the shared network.

# Caches shared across all workspace containers, so a fresh workspace does not re-download the
# world. Deployments running several stacks on one host must override these together with
# qits.workspace.network.
qits.workspace.claude-volume=qits_shared_dot_claude
qits.workspace.claude-mount=/claude-home

# Where the AGENT CONFIGURATION DOCUMENT lands inside a container: the path the daemon materializes
# the injected document at and hands to the shared harness library, told outright the same way the
# daemon is told its API base path. The document itself rides the environment as
# QITS_WORKSPACE_DAEMON_AGENT_CONFIGURATION, because the orchestrator's spec admits named volumes
# and the docker socket and no host path at all — see AGENTS.md, "The agent configuration a
# container is born with".
#
# /tmp, and each alternative is a real defect: /etc/qits is root-owned while the container runs as
# the host uid, /workspace is the checkout volume (a file there shows up in `git status`), and
# /claude-home is SHARED by every container on the platform, so a per-container document written
# there would be overwritten by the next container to boot. /tmp is world-writable everywhere and
# dies with the container, which is exactly this document's lifetime.
qits.workspace.agent-configuration-path=/tmp/qits/agent-configuration.json
qits.workspace.maven-volume=qits_shared_m2
qits.workspace.pnpm-volume=qits_shared_pnpm

# A per-workspace named volume for /workspace, so the checkout survives a container being recreated
# onto a newer image. Turning this off makes every recreate a fresh clone.
qits.workspace.persist-workspace=true
qits.workspace.workspace-volume-prefix=qits_workspace_

# Resource caps. Blank means unset (the runtime's own default applies). The swap value is docker's
# --memory-swap, a TOTAL that includes the memory cap: 4g/8g is 4G of RAM plus 4G of swap. Blanking
# the swap key alone falls back to the hard cap (swap = memory). Workspace containers are the only
# platform containers granted swap, which is why the grant lives here and not in qits-containers.
qits.workspace.memory-limit=4g
qits.workspace.memory-swap-limit=8g
qits.workspace.pids-limit=
qits.workspace.cpus=
qits.workspace.timezone=

# Provisioning windows: how long to wait for the daemon's control socket to appear, and then for its
# self-clone (plus recursive submodules) to finish. The second is generous on purpose — a cold clone
# of a large repo is slow, and failing it early strands a half-provisioned container.
qits.workspace.provision.connect-timeout-ms=30000
qits.workspace.provision.timeout-ms=600000

# How long a DescribeConfig may take before the daemon is treated as not answering.
qits.workspace.config.describe-timeout-ms=10000

# Kill switch for the daemon's own push of committed work.
qits.workspace.auto-push.enabled=true

# The in-container workspace-daemon's HTTP API: the port it binds, and the bearer every proxied call
# presents. The proxy at /workspaces/container/{id}/** is the only thing that ever sends it.
#
# THIS TOKEN IS A HANDSHAKE CONSTANT, NOT A CREDENTIAL, and nothing should be built as though it
# were one. One value, shared by every container: no derivation, no per-workspace secret, no column,
# no migration. Its only job is to satisfy the daemon's bind precondition — WorkspaceApi refuses to
# bind at all without one, which is isolation that already exists and is not ours to remove. It is
# readable by every coding agent (an agent can read its own environment) and it opens every daemon,
# and that is accepted rather than overlooked: qits-net is trusted (migration-plan.md §9 item 21),
# the same posture that already lets that agent reach qits-projects directly. What makes it
# acceptable to defer is that the daemon's inbound listener goes away rather than the token getting
# harder — see the stage 2 dial-back tunnel.
#
# So: do not describe this as a boundary, in a javadoc, a comment or a review. That is how an
# accepted exposure becomes an assumed protection. If qits-net ever stops being trusted, the VALUE
# becomes per-workspace (an HMAC over the workspace id needs no storage) and the service starts
# refusing to boot without a real secret — the injection point, the env var and the proxy's bearer
# header do not move, which is why deferring costs nothing.
qits.workspace.daemon-api-port=13338
qits.workspace.daemon-api-token=qits-workspace-daemon

# The reverse tunnel: how a daemon at DaemonProtocol.TUNNEL_CAPABILITY_VERSION or above is reached,
# now that it binds 127.0.0.1 and has no address on qits-net at all. A loopback listener per
# workspace, whose accepted connections that workspace's daemon dials back for and pipes to its own
# API. The kill switch is an escape hatch for a broken tunnel, NOT a supported topology: a daemon at
# that capability has already stopped listening, so turning this off makes it unreachable rather
# than reachable the old way. The nonce ttl bounds one WebSocket dial on a docker network.
qits.workspace.daemon-tunnel.enabled=true
qits.workspace.daemon-tunnel.nonce-ttl-ms=10000

# The agent dispatch door (POST /workspaces/api/agent-dispatches). The door answers immediately and
# the launch happens later, so all three of these are about the WAIT rather than about the request:
# the window is how long a scheduled launch keeps asking a daemon that is not answering yet — long,
# because the thing being waited on is an image pull on a cold host — and the interval is how often
# it asks. The request timeout bounds one call to a daemon that IS answering: short, because the
# caller polls and a hung request is worse than one retried a tick later.
qits.workspace.agent-dispatch.launch-window-ms=900000
qits.workspace.agent-dispatch.poll-interval-ms=2000
qits.workspace.agent-dispatch.request-timeout-ms=10000

# Explicit rather than inherited: a tunnelled terminal is idle for long stretches, and the default
# (30 minutes) is one of three timers that could close it. Naming it here makes which one visible.
quarkus.http.idle-timeout=1H

# The identity workspace containers commit as.
qits.git.author-name=qits
qits.git.author-email=qits@local

# NOT claimed here, on purpose: qits.bootstrap.* and qits.services.* are read by
# WorkspaceContainerFactory only to forward them into the container as QITS_WORKSPACE_DAEMON_* env.
# They belong to the bootstrap and services contexts; this jar ships only the code-level
# defaultValue for them, because a library claiming another context's keys at ordinal 100 is a
# config-source collision.
