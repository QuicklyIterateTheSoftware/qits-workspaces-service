# The suite runs against an EMBEDDED POSTGRES — real binaries, spawned as a child process by zonky,
# never a container, which is what keeps the no-docker rule true now that the store is postgres. Its
# port is chosen at run time, so the url/username/password are not written here at all:
# EmbeddedPgConfigSource supplies them at an ordinal above this file. What is left here is what a
# file can say. clean-at-start wipes the schema between Quarkus restarts, which is what keeps a suite
# sharing one database across classes reproducible.
quarkus.hibernate-orm.workspaces.datasource=workspaces
quarkus.hibernate-orm.workspaces.packages=eu.wohlben.qits.workspaces.entity
quarkus.flyway.workspaces.migrate-at-start=true
quarkus.flyway.workspaces.clean-at-start=true
quarkus.flyway.workspaces.locations=classpath:db/workspaces/migration

# Where the suite's fixture git host lives: TestOrigin builds a bare origin per repository under
# target/, so a run leaves nothing behind, and FakeGitHostAddress points the mirror's fetch and push
# at them — which is what makes every push in this suite a real push into a real bare.
#
# TEST-ONLY. Nothing in src/main reads this key and no deployment sets it. It stands in for the git
# host, which in a deployment is qits.githost.url over HTTP and is on nobody's disk.
qits.test.origins-dir=target/workspaces-test-data

# This service's own tree: the git mirrors, their worktrees and the metadata sidecars. Separate from
# the line above on purpose — the tree it fetches from must not be the tree it keeps, or the suite
# would prove nothing about the separation.
qits.workspaces.data-dir=target/workspaces-test-own

# The suite's fixtures are seconds old and change between assertions, so nothing may be served from
# a freshness window. Shipped default is 5s; here every read fetches.
qits.workspace.git.mirror-freshness-ms=0

# The eventstream jar rides into this module with CausedRow (Workspace and WorkspaceEvent's
# causation column), and this suite owes it the two facts `service`'s suite already owes: DARKNESS —
# no publish, no sweep, no catch-up thread, since nothing here is on the bus — and a DATABASE, which
# EmbeddedPgConfigSource supplies beside the workspaces one. Dark is not absent: Quarkus opens the
# connection and runs Flyway at boot either way. clean-at-start for the same reproducibility the
# workspaces datasource gets above.
qits.eventstream.enabled=false
qits.eventstream.catchup-at-startup=false
quarkus.flyway.eventstream.clean-at-start=true

# The domain module ships no ContainerRuntime implementation any more — the adapter is the
# deployable's, because the machine token's producer needs an extension this module must not grow —
# so FakeContainerRuntime is the only bean of that type here and nothing reaches an orchestrator.
